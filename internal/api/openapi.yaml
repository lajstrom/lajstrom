openapi: 3.1.0
info:
  title: Lajstrom management API
  version: v1
  description: >-
    The REST interface to Lajstrom's control plane: repos, users, bindings, tokens and the audit
    log. docs/api.md is the guide; this document is checked against the server's routes by
    TestOpenAPIRoutes, its error codes against the server's and docs/api.md's by
    TestErrorCodes, the keys of its schemas against the keywords of JSON Schema by
    TestOpenAPIKeywords, ReindexRun against the server's type by TestOpenAPIReindexRun, and the
    statuses of each operation against those its handler answers in the tests of internal/api
    (statuses_test.go). Any operation may also answer 408 and 413 to a body, 500 and 503, as
    the Errors of docs/api.md say.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: repos
    description: Repos and their reindex runs.
  - name: tokens
    description: Personal access tokens of a user and deploy tokens of a repo.
  - name: users
    description: Local users.
  - name: bindings
    description: Roles of users on the repos of a mask.
  - name: audit
    description: The audit log.
  - name: webhooks
    description: Where the events of the repos of a mask are sent, and the delivery log.
  - name: policy
    description: Policy rules and verdicts, what a repo serves (docs/spec/policy.md).
  - name: meta
    description: Who is asking, the server, and this document.
security:
  - basic: []
  - bearer: []
  - dpop: []
paths:
  /api/v1/repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: The repos the caller may read.
      parameters:
        - name: format
          in: query
          description: Only the repos of this format.
          schema: {type: string}
      responses:
        "200":
          description: The repos, by format and name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepoList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [repos]
      operationId: createRepo
      summary: Create a repo (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRepo"}
      responses:
        "201":
          description: The repo.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repo"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/repos/{format}/{repo}:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    get:
      tags: [repos]
      operationId: getRepo
      summary: One repo (read).
      responses:
        "200":
          description: The repo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [repos]
      operationId: updateRepo
      summary: >-
        Change anonymousRead, policy, a proxy's upstream and a group's group (manage);
        changing upstream.name or group.members needs the admin role, sending back the
        value the repo has does not. {"kind": "hosted"}, alone, turns a proxy into a hosted
        repo that keeps what it holds, its dist-tags written to its journal (the admin role).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RepoPatch"}
      responses:
        "200":
          description: The repo as it is then.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repo"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/Unavailable"}
    delete:
      tags: [repos]
      operationId: deleteRepo
      summary: Delete a repo (manage); force deletes one that has versions.
      parameters:
        - name: force
          in: query
          schema: {type: boolean}
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/repos/{format}/{repo}/reindex:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    post:
      tags: [repos]
      operationId: reindexRepo
      summary: Start a reindex of the repo (manage).
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReindexRequest"}
      responses:
        "202":
          description: The run, started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReindexRun"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/Unavailable"}
    get:
      tags: [repos]
      operationId: reindexStatus
      summary: The latest run that covered the repo, with its report (manage).
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReindexRun"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/packages:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    get:
      tags: [repos]
      operationId: listPackages
      summary: A page of the repo's packages, by name unless sort says otherwise (read).
      parameters:
        - name: prefix
          in: query
          description: Only the packages whose name starts with it.
          schema: {type: string}
        - name: q
          in: query
          description: >-
            Only the packages whose name, or the summary of one of whose manifests, contains it;
            ASCII letters in either case.
          schema: {type: string}
        - name: attr
          in: query
          description: >-
            Only the packages with a manifest that has the attribute, <key>:<value> with the
            annotation's full key (lajstrom.deb.suite:jammy). Two values of one key are
            alternatives; different keys hold on the same manifest. At most 16.
          schema:
            type: array
            maxItems: 16
            items: {type: string, pattern: '^lajstrom\.[A-Za-z0-9._-]+:'}
          style: form
          explode: true
        - name: sort
          in: query
          description: >-
            The order: name, updated (the newest manifest's publish time), versions (how many) or
            size (of all its files); name when absent. A tie follows by name.
          schema: {type: string, enum: [name, updated, versions, size], default: name}
        - name: order
          in: query
          description: asc or desc; asc for name and desc for the other sorts when absent.
          schema: {type: string, enum: [asc, desc]}
        - name: facet
          in: query
          description: >-
            Adds facets: the values of this key in the repo's manifests, each with the number of
            packages that have it. They count the whole repo, whatever the other parameters. At
            most 16.
          schema:
            type: array
            maxItems: 16
            items: {type: string, pattern: '^lajstrom\.[A-Za-z0-9._-]+$'}
          style: form
          explode: true
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The page; the cursor holds the place of its last package in the order of sort.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PackageList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/packages/{name}:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
    get:
      tags: [repos]
      operationId: getPackage
      summary: >-
        One package (read): its row of the package list, the OCI repository that holds it and the
        metadata layer of its head manifest.
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PackageDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/packages/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
    get:
      tags: [repos]
      operationId: listVersions
      summary: >-
        A page of the package's versions, newest first (read): each with the digests and facts of
        its variants, its publish time and the pointers that name it.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: without
          in: query
          description: >-
            Keeps the variants that have no attachment of this kind, whatever its verification
            (#89); given again, a variant must lack every kind given. A version is listed with
            those of its variants, at their times, so a cursor is for the same filter.
          schema:
            type: array
            items: {type: string, enum: [signature, sbom, scan, provenance, attestation, other]}
          style: form
          explode: true
      responses:
        "200":
          description: The page; the cursor holds the place of its last version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VersionList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/packages/{name}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
      - name: version
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [repos]
      operationId: getVersion
      summary: >-
        One version (read): its variants, each with what the index has of its manifest and its
        files, and the OCI repository that holds it. The manifest and its referrers are not in it:
        they are GET …/manifest and …/referrers.
      parameters:
        - name: variant
          in: query
          description: Only this variant; empty for a format without variants.
          schema: {type: string}
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VersionDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [repos]
      operationId: deleteVersion
      summary: >-
        Delete a version (delete): every variant, or the one variant names; each manifest with its
        referrers, its rows and an audit row. If-Match and If-Unmodified-Since make it a
        compare-and-delete, checked under the lock of each manifest; a version a pointer names
        is refused unless forced.
      parameters:
        - name: variant
          in: query
          description: Only this variant; empty for a format without variants.
          schema: {type: string}
        - name: force
          in: query
          description: Delete a version that pointers (npm dist-tags) name.
          schema: {type: boolean}
        - name: If-Match
          in: header
          description: >-
            The digests of the variants the client read, each a quoted entity tag
            ("sha256:…"), separated by commas; the delete goes ahead only when the variants it
            deletes have exactly these digests. * matches any.
          schema: {type: string}
        - name: If-Unmodified-Since
          in: header
          description: >-
            An HTTP-date, the cut-off: the delete goes ahead only when no variant it deletes was
            published after it.
          schema: {type: string}
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "501":
          description: >-
            The repo's registry does not delete manifests (capabilities.deleteManifest false), and
            nothing was deleted; or this server deletes no versions. Code UNAVAILABLE.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: >-
            The registry refused the delete: it rejected Lajstrom's credentials or the request.
            Code UNAVAILABLE; the message names the variants deleted before, which stay deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/repos/{format}/{repo}/packages/{name}/versions/{version}/yank:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
      - name: version
        in: path
        required: true
        schema: {type: string}
    put:
      tags: [repos]
      operationId: yankVersion
      summary: >-
        Yank a version of a hosted pypi repo (write; PEP 592): every file of it is marked yanked
        in the simple index, with the reason or none, and pip skips it unless a requirement pins
        it with ==. An entry of the package's journal and an audit row pypi.yank; a yank with the
        reason the version has appends nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YankRequest"}
      responses:
        "204": {description: "Yanked, or yanked already with this reason."}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/Unavailable"}
        "503":
          description: >-
            The registry did not serve the new entry of the yank within the visibility timeout, or
            the index did not answer; try again after Retry-After. Code UNAVAILABLE.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      tags: [repos]
      operationId: unyankVersion
      summary: >-
        Unyank a version of a hosted pypi repo (write): an entry of the package's journal and an
        audit row pypi.yank; a version that is not yanked appends nothing.
      responses:
        "204": {description: "Unyanked, or not yanked."}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/Unavailable"}
        "503":
          description: >-
            The registry did not serve the new entry within the visibility timeout, or the index
            did not answer; try again after Retry-After. Code UNAVAILABLE.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/repos/{format}/{repo}/packages/{name}/versions/{version}/attachments:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
      - name: version
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [repos]
      operationId: listAttachments
      summary: >-
        The attachments of a version (read): the signatures, SBOMs, scan reports and attestations
        of its variants' referrers, as the index has them, newest first, each labelled with its
        verification against the operator's trust. Every result is kept: the list is their history.
      parameters:
        - name: variant
          in: query
          description: Only this variant; empty for a format without variants.
          schema: {type: string}
        - name: kind
          in: query
          description: Only the attachments of this kind.
          schema: {type: string, enum: [signature, sbom, scan, provenance, attestation, other]}
        - name: predicateType
          in: query
          description: Only the attachments of this predicate type, as written.
          schema: {type: string}
        - name: verified
          in: query
          description: true keeps the verified attachments, false the others.
          schema: {type: boolean}
        - name: limit
          in: query
          description: At most this many, the newest; 1000 by default and at most.
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: The attachments.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttachmentList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/packages/{name}/versions/{version}/manifest:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
      - name: version
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [repos]
      operationId: getManifests
      summary: >-
        The manifests of a version (read): each variant's, read from the registry by the digest
        the index has and checked against it. One variant has its digest as ETag.
      parameters:
        - name: variant
          in: query
          description: Only this variant; empty for a format without variants.
          schema: {type: string}
        - name: If-None-Match
          in: header
          description: The ETag of an answer of one variant; 304 when it is still its digest, without a registry read.
          schema: {type: string}
      responses:
        "200":
          description: The manifests, in variant order.
          headers:
            ETag:
              description: "The variant's manifest digest, quoted; only when the answer has one variant."
              schema: {type: string}
            Cache-Control:
              description: no-cache.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManifestList"}
        "304":
          description: The variant has the digest of If-None-Match; no body.
          headers:
            ETag:
              description: The variant's manifest digest, quoted.
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/Unavailable"}
        "503":
          description: The registry did not answer, or its circuit breaker is open; code UNAVAILABLE.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/repos/{format}/{repo}/packages/{name}/versions/{version}/referrers:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/package"
      - name: version
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [repos]
      operationId: listReferrers
      summary: >-
        The referrers of a version (read): the manifests whose subject is a variant's manifest,
        as the registry lists them now, through its referrers API or the tag schema.
      parameters:
        - name: variant
          in: query
          description: Only this variant; empty for a format without variants.
          schema: {type: string}
        - name: artifactType
          in: query
          description: Only the referrers of this artifact type.
          schema: {type: string}
      responses:
        "200":
          description: The referrers, by variant in variant order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReferrerList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/Unavailable"}
        "503":
          description: The registry did not answer, or its circuit breaker is open; code UNAVAILABLE.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/repos/{format}/{repo}/versions:delete:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    post:
      tags: [repos]
      operationId: deleteVersions
      summary: >-
        Delete versions in a batch (delete): each item under its own lock, with the conditions of
        the single delete, and a result per item; not all-or-nothing, and a rerun is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BatchDeleteRequest"}
      responses:
        "200":
          description: What became of each item, in the order of the request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchDeleteResult"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/Unavailable"}
  /api/v1/repos/{format}/{repo}/upstream-cache:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    delete:
      tags: [repos]
      operationId: purgeUpstreamCache
      summary: >-
        Drop a proxy repo's cache of its upstream's documents, or of one name (manage); the next
        read asks the upstream again. What the repo fetched stays.
      parameters:
        - name: name
          in: query
          description: Only the documents of this package name.
          schema: {type: string}
      responses:
        "204": {description: Dropped.}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/sessions:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    get:
      tags: [repos]
      operationId: listSessions
      summary: A page of the repo's open publication sessions, maven deploys that wait for their maven-metadata.xml, by id (manage).
      description: >-
        Only the sessions whose time is not up; never one that committed, was aborted or expired, nor
        a blob upload of /v2. A repo of a format that opens no session, and a group, have none.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/repos/{format}/{repo}/prefetch:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    post:
      tags: [repos]
      operationId: prefetch
      summary: >-
        Fetch versions of a list of names into a proxy repo before a client asks for them
        (manage), each as a miss would, or the images of a list of references into an oci proxy
        repo, each as a pull would; what the repo holds is held, and a rerun is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PrefetchRequest"}
      responses:
        "200":
          description: >-
            A result per version, and per name that failed before its versions, in the order of
            the names; of an oci repo, per image, platform and blob not held, in the order of the
            images.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PrefetchResult"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/Unavailable"}
  /api/v1/repos/{format}/{repo}/deploy-tokens:
    parameters:
      - $ref: "#/components/parameters/format"
      - $ref: "#/components/parameters/repo"
    get:
      tags: [tokens]
      operationId: listDeployTokens
      summary: The deploy tokens of a repo (manage).
      responses:
        "200":
          description: The tokens, in the order of their creation; never a secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
