    get:
      tags: [tokens]
      operationId: listTokens
      summary: The personal access tokens of a user (the user, or admin).
      responses:
        "200":
          description: The tokens, in the order of their creation; never a secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a personal access token of a user; the answer has its secret, once.
      description: >-
        Only a password creates one: a request whose credential is a personal access token,
        with scopes or without, or a deploy token is 403. A service account's are created by
        the admin; their expiry is bounded by auth.serviceAccounts.maxTokenTTL, 365 days by
        default, and with the bound 0 one created without an expiry never expires.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TokenRequest"}
      responses:
        "201":
          description: The token and its secret.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedToken"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/users/{user}/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/user"
      - $ref: "#/components/parameters/id"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a personal access token; a revoked one again is 204.
      responses:
        "204": {description: Revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/bindings:
    get:
      tags: [bindings]
      operationId: listBindings
      summary: A page of the bindings, by id (admin).
      parameters:
        - name: principal
          in: query
          description: Only the bindings of user:<name> or user:<uid>.
          schema: {type: string}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BindingList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [bindings]
      operationId: createBinding
      summary: Create a binding (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BindingRequest"}
      responses:
        "201":
          description: The binding.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Binding"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/bindings/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      tags: [bindings]
      operationId: deleteBinding
      summary: Delete a binding (admin); not the last admin binding of an enabled user.
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: A page of the audit log, newest first (admin).
      parameters:
        - name: repo
          in: query
          description: <format>/<name>.
          schema: {type: string}
        - name: principal
          in: query
          description: user:<name>, user:<uid>, token:<id> or anonymous.
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string}
        - name: state
          in: query
          description: The outcome; only the row of a registry write is ever another than ok.
          schema: {type: string, enum: [ok, pending, failed, unknown]}
        - name: since
          in: query
          description: Inclusive.
          schema: {type: string, format: date-time}
        - name: until
          in: query
          description: Exclusive.
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditList"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/whoami:
    get:
      tags: [meta]
      operationId: whoami
      summary: The caller's principal; without credentials 401.
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Whoami"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/info:
    get:
      tags: [meta]
      operationId: getInfo
      summary: The server's build and facts, and the caller; to anyone.
      description: >-
        What a client needs before it signs in: the build, server.externalURL,
        auth.anonymousRead, the format plugins the server serves, how a person signs in, and the
        caller with whether its credential reaches the admin role. Without credentials it is 200
        with the anonymous caller; credentials that are refused are 401, as on every route.
      security:
        - {}
        - basic: []
        - bearer: []
      responses:
        "200":
          description: The server and the caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Info"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/search:
    get:
      tags: [repos]
      operationId: search
      summary: Packages by name and summary, manifests and files by digest, over the repos the caller may read.
      description: >-
        A repo the caller may not read adds no hit, and the answer does not tell whether one exists.
        The hits come in ranks, each in byte order of the repo's format and name and the package's
        name: when q is a digest's prefix (sha256: or not, 8 to 64 hex digits) the manifests whose
        digest starts with it, then the file layers whose digest does; then the packages named q,
        whose name starts with it, whose name contains it, and with a manifest whose summary
        contains it, ASCII letters in either case. There is no total.
      security:
        - {}
        - basic: []
        - bearer: []
      parameters:
        - name: q
          in: query
          required: true
          description: A name, a part of a name or a summary, or a digest's prefix.
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: format
          in: query
          description: Only the repos of this format.
          schema: {type: string}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: The page; the cursor holds the place of its last hit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResult"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/registries:
    get:
      tags: [meta]
      operationId: listRegistries
      summary: The registries of the configuration, their capabilities, repos and health, as the replica that answers knows them (admin).
      description: >-
        Never Lajstrom's credentials for a registry. Each replica probes and pings the registries
        itself; the answer sends no request to a registry. /-/readyz stays public and without detail.
      responses:
        "200":
          description: The registries, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistryList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/bootstrap:
    post:
      tags: [users]
      operationId: bootstrap
      summary: The first admin, for the bootstrap token; 404 once an admin exists.
      description: >-
        Creates the first admin, with the admin binding on */*, for the one-time bootstrap token
        that serve made valid at start while no enabled user had an admin binding. The token is
        the credential: no other is needed. Once an admin exists, every request is 404.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BootstrapRequest"}
      responses:
        "201":
          description: The admin.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/Invalid"}
        "403":
          description: The token is refused, or it is the token and it was used or expired.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429":
          description: Too many wrong tokens from the client address; try again after Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/login:
    post:
      tags: [tokens]
      operationId: login
      summary: Sign in a web UI; the answer is a short-lived personal access token, once.
      description: >-
        For a local user's name and password, checked as Basic credentials are, with the same
        throttles of failed logins; or for the code that the callback of an OIDC login started
        with return_to, code_challenge and dpop_jkt handed the UI, with the PKCE verifier of that
        challenge, redeemed once. Either way with a DPoP proof (RFC 9449) of the browser's key in
        the header DPoP, checked before the credential, the key of dpop_jkt for a code. The
        answer is a personal access token of the user without scopes, bound to that key
        (dpopJkt, tokenType DPoP), named login <time> <4 hex> or oidc <time> <4 hex>, that
        expires after auth.login.tokenLifetime (12 hours by default), and for a code after
        auth.oidc.tokenLifetime when that is shorter; there is no refresh. The UI sends it as
        Authorization: DPoP with a new proof of the key on every request to /api/, where alone
        it works, and revokes it at sign-out with DELETE
        /api/v1/users/{user}/tokens/{id}. The request takes no credential: its Authorization
        header is ignored. No answer sets a cookie (docs/spec/rbac.md §10).
      security:
        - {}
      parameters:
        - {$ref: "#/components/parameters/dpopProof"}
      requestBody:
        description: The credential of the sign-in.
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "201":
          description: The token and its secret.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginToken"}
        "400":
          description: >-
            The body is neither form, the code is unknown, used, expired, of another verifier or
            of another key, or the DPoP proof is missing, refused or used already; the message
            says why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: >-
            The user name or the password is wrong, or the user may not sign in, the reason not
            told; or the user of a code was disabled since its login.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: Too many failed logins of the account or from the client address; try again after Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "501": {$ref: "#/components/responses/Unavailable"}
  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: openAPI
      summary: This document.
      security:
        - {}
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: A local user's name and its password or personal access token, or a deploy token under any user name (deploy:<deploy token>).
    bearer:
      type: http
      scheme: bearer
      description: A personal access token (ljs_pat_…) or a deploy token (ljs_dep_…), but one bound to a DPoP key.
    dpop:
      type: http
      scheme: dpop
      description: >-
        The token of a web UI's sign-in (POST /api/v1/login), bound to the browser's key, with a
        DPoP proof of that key in the header DPoP on every request (RFC 9449): typ dpop+jwt, alg
        ES256, htm and htu of the request (htu with the scheme and host of server.externalURL),
        iat within 5 minutes, ath the base64url SHA-256 of the token, a jti used once. On /api/
        only. A refused proof is 401 with WWW-Authenticate DPoP error="invalid_dpop_proof", a
        refused token error="invalid_token"; there is no DPoP-Nonce.
  headers:
    Location:
      description: The path of the created resource.
      schema: {type: string}
  parameters:
    dpopProof:
      name: DPoP
      in: header
      required: true
      description: >-
        A DPoP proof (RFC 9449 §4): a JWT with typ dpop+jwt, alg ES256 and the public P-256 key
        in jwk, whose claims are htm POST, htu <server.externalURL>/api/v1/login, iat within 5
        minutes of the server's clock and a jti used once. The token is bound to its key.
      schema: {type: string, maxLength: 4096}
    format:
      name: format
      in: path
      required: true
      schema: {type: string}
    repo:
      name: repo
      in: path
      required: true
      schema: {type: string}
    id:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    package:
      name: name
      in: path
      required: true
      description: The package name in the format's spelling; a raw path escapes its / as %2F.
      schema: {type: string}
    user:
      name: user
      in: path
      required: true
      description: The user's name or its uid.
      schema: {type: string}
    limit:
      name: limit
      in: query
      description: The size of the page, 100 when absent.
      schema: {type: integer, minimum: 1, maximum: 1000}
    cursor:
      name: cursor
      in: query
      description: The next of the page before; opaque.
      schema: {type: string}
  responses:
    Invalid:
      description: The request breaks a rule; the message names the field.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: No credentials, or credentials that are refused; code UNAUTHENTICATED.
      headers:
        WWW-Authenticate:
          description: Basic realm="lajstrom".
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: The caller may not do this; code FORBIDDEN.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such resource, or a repo the caller may not read.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The resource exists, or the change would break a rule of the server.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PreconditionFailed:
      description: >-
        The version changed since the client read it, or was published after the cut-off; code
        CONFLICT. Nothing was deleted.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: Not enabled in this server; code UNAVAILABLE.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [NOT_FOUND, CONFLICT, UNAUTHENTICATED, FORBIDDEN, INVALID, UNAVAILABLE, INTERNAL]
            message: {type: string}
    Repo:
      type: object
      required: [format, name, kind, anonymousRead, createdAt, updatedAt]
      properties:
        format: {type: string}
        name: {type: string}
        registry: {type: string, description: Absent on a group.}
        kind: {type: string, enum: [hosted, proxy, group]}
        anonymousRead: {type: boolean}
        policy:
          anyOf:
            - {$ref: "#/components/schemas/Policy"}
            - {type: "null"}
          description: Absent on a group.
        upstream:
          $ref: "#/components/schemas/Upstream"
          description: A proxy repo only, with every key; absent on another kind.
        group:
          $ref: "#/components/schemas/Group"
          description: A group only, with members and merge, or members and paths on a group of oci repos; absent on another kind.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        permissions:
          type: array
          description: >-
            Answered by GET only: of read, write, delete and manage, those the request's principal has
            on the repo within the scopes of its credential (docs/spec/rbac.md §3), in that order.
          items: {type: string, enum: [read, write, delete, manage]}
        stats:
          $ref: "#/components/schemas/RepoStats"
          description: Answered by GET only; absent on a group and an oci repo, which index no versions.
        signingKeys:
          type: array
          description: >-
            Answered by GET only, on an apt or rpm repo: its signing keys, the active one first, then the
            retired ones, the most recently retired first; [] before its first key.
          items: {$ref: "#/components/schemas/SigningKey"}
    RepoStats:
      type: object
      description: Counts of the index's rows of a repo (docs/api.md, Repos); reindex rebuilds them.
      required: [packages, versions, manifests, files, size, lastPublishedAt]
      properties:
        packages: {type: integer}
        versions: {type: integer, description: Distinct versions of its packages.}
        manifests: {type: integer, description: One per variant of a version.}
        files: {type: integer, description: The file layers of its manifests.}
        size: {type: integer, description: "The sum of their sizes in bytes: a blob of two manifests counts twice, the metadata layer not at all."}
        lastPublishedAt: {type: [string, "null"], format: date-time, description: The newest publish time of its manifests.}
    SigningKey:
      type: object
      description: The public facts of a repo's OpenPGP signing key.
      required: [fingerprint, algorithm, createdAt, retiredAt]
      properties:
        fingerprint: {type: string, description: Uppercase hexadecimal.}
        algorithm: {type: string, description: "ed25519 or rsa4096 for a key made by Lajstrom; rsa2048, rsa3072, rsa4096 or ecdsa-p256 for one in a KMS."}
        createdAt: {type: string, format: date-time}
        retiredAt: {type: [string, "null"], format: date-time, description: Null for the active key.}
    Group:
      type: object
      description: >-
        A group's settings (docs/spec/proxy-and-group.md §2.3): its members, read in order, and
        the names a hosted member does not hide; or, on a group of oci repos (§12.1), its
        members and the routes that send each path to one of them.
      required: [members]
      additionalProperties: false
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 16
          description: Repos of the group's format by name, in order; each hosted or proxy, at most one hosted but in a group of oci repos.
          items: {type: string}
        merge:
          type: array
          maxItems: 256
          description: Name patterns whose versions are merged across members even when the hosted member holds the name; not on a group of oci repos.
          items: {type: string, minLength: 1, maxLength: 256}
        paths:
          type: object
          description: >-
            A group of oci repos only, required there: each member's name to the patterns of the
            paths it serves, "<path>", "<prefix>/*" or "*". Every member has one at least, no
            pattern is on two members, 256 in all at most; the most specific pattern that matches
            a path routes it.
          additionalProperties:
            type: array
            minItems: 1
            items: {type: string, minLength: 1, maxLength: 256}
    Upstream:
      type: object
      description: >-
        A proxy repo's settings (docs/spec/proxy-and-group.md §2.2). The upstream is named as the
        configuration names it (upstreams[].name); its URL and credentials are configuration and
        never part of the API. Absent keys take their defaults.
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, description: "One of upstreams[].name of the repo's format."}
        metadataTTL: {type: string, description: "How long a cached document is used, a duration from 0s to 168h; default 10m.", examples: [10m]}
        negativeTTL: {type: string, description: "How long a name the upstream does not have is remembered, 0s to 24h; default 2m.", examples: [2m]}
        offline: {type: boolean, description: "Never ask the upstream; default false."}
        allow:
          type: array
          maxItems: 256
          description: "Name patterns, * matching any run: a name is fetched when one matches; empty, every name."
          items: {type: string, minLength: 1, maxLength: 256}
        deny:
          type: array
          maxItems: 256
          description: Name patterns that are never fetched; deny wins over allow.
          items: {type: string, minLength: 1, maxLength: 256}
    Policy:
      type: object
      description: >-
        The policy of a repo: the keys the server reads, with their defaults when absent
        (maxFileSize by format: npm 512 MiB, pypi and maven 4 GiB, apt and raw 8 GiB, oci 16 GiB;
        blobRedirect auto, maven.sessionTimeout 30m, maven.maxSessionFiles 256, maven.versionPolicy
        release). Any other key is 400.
      additionalProperties: false
      properties:
        maxFileSize:
          type: integer
          format: int64
          minimum: 1
          description: The largest file an upload, or a /v2 blob, may carry, in bytes; on every repo, oci included.
        blobRedirect: {type: string, enum: [auto, never]}
        maven:
          type: object
          description: A maven repo only.
          additionalProperties: false
          properties:
            sessionTimeout:
              type: string
              description: How long a publication session lives after its last request, a duration from 1m to 24h.
              examples: [45m]
            maxSessionFiles:
              type: integer
              minimum: 1
              maximum: 999
              description: >-
                How many files a publication session of a deploy stores, signatures included,
                checksum files and maven-metadata.xml not; the next is 400.
            versionPolicy:
              type: string
              enum: [release, snapshot]
              description: >-
                Which versions a deploy may add: release versions, or the builds of SNAPSHOT
                versions, each deploy one more build under its own tag. The other kind is 400; a
                change applies to the deploys after it.
    PolicyPatch:
      type: object
      description: >-
        An RFC 7396 merge patch of the policy: a member sets its key, null removes it, maven
        merges key by key. The policy that results is checked as a whole.
      additionalProperties: false
      properties:
        maxFileSize: {type: [integer, "null"], format: int64, minimum: 1}
        blobRedirect: {type: [string, "null"], enum: [auto, never, null]}
        maven:
          type: [object, "null"]
          additionalProperties: false
          properties:
            sessionTimeout: {type: [string, "null"]}
            maxSessionFiles: {type: [integer, "null"], minimum: 1, maximum: 999}
            versionPolicy: {type: [string, "null"], enum: [release, snapshot, null]}
    RepoList:
      type: object
      required: [repos]
      properties:
        repos:
          type: array
          items: {$ref: "#/components/schemas/Repo"}
    CreateRepo:
      type: object
      required: [format, name]
      additionalProperties: false
      properties:
        format: {type: string}
        name: {type: string}
        registry: {type: string, description: "Required but on a group, which has none."}
        kind: {type: string, enum: [hosted, proxy, group]}
        anonymousRead: {type: boolean}
        policy:
          anyOf:
            - {$ref: "#/components/schemas/Policy"}
            - {type: "null"}
          description: None on a group.
        upstream:
          anyOf:
            - {$ref: "#/components/schemas/Upstream"}
            - {type: "null"}
          description: Required on a proxy repo, refused on another kind.
        group:
          anyOf:
            - {$ref: "#/components/schemas/Group"}
            - {type: "null"}
          description: Required on a group, refused on another kind.
    RepoPatch:
      type: object
      additionalProperties: false
      properties:
        anonymousRead: {type: boolean}
        policy:
          anyOf:
            - {$ref: "#/components/schemas/PolicyPatch"}
            - {type: "null"}
        upstream:
          type: object
          description: >-
            A proxy repo only: an RFC 7396 merge patch of its settings (the keys of Upstream),
            checked whole after the merge; allow and deny are replaced whole. Changing name needs
            the admin role and drops the repo's cache of the old upstream; the name the repo
            has, sent back, is no change. The other keys need manage.
        group:
          type: object
          description: >-
            A group only: an RFC 7396 merge patch of its settings (the keys of Group), checked
            whole after the merge; each list is replaced whole, and a key of paths set to null
            is removed. Changing members, their order included, or paths needs the admin role;
            the members and paths the group has, sent back, are no change. merge needs manage.
        kind:
          type: string
          enum: [hosted]
          description: >-
            Alone in the body, by the admin role: a proxy becomes a hosted repo that keeps what it
            holds, its dist-tags and deprecations written to its journal; 409 while a fetch runs
            or when a group of it has a hosted member. On a hosted repo it resumes a conversion
            that stopped half way, else changes nothing.
    ReindexRequest:
      type: object
      additionalProperties: false
      properties:
        prune: {type: boolean}
        verify: {type: boolean}
    ReindexRun:
      type: object
      required: [id, state, source, principal, replica, allRepos, prune, verify, startedAt, heartbeatAt, finishedAt, report]
      properties:
        id: {type: integer, format: int64}
        state: {type: string}
        source: {type: string}
        principal: {type: string}
        replica: {type: string}
        allRepos: {type: boolean}
        prune: {type: boolean}
        verify: {type: boolean}
        startedAt: {type: string, format: date-time}
        heartbeatAt: {type: string, format: date-time}
        finishedAt: {type: [string, "null"], format: date-time}
        error: {type: string}
        report:
          description: >-
            The repo's part of the run's report; null while the run is running, and for a run of
            every repo that stopped before it reached the repo. Each list holds at most 1000
            entries, after which truncated is true; the counts stay exact. In the report of a run
            of an earlier release, a count it did not write is 0 and a list it did not write null.
          type: [object, "null"]
          required: [repo, ociRepositories, manifests, added, updated, unchanged, removed, pending, deletedPending, degraded, referrers, attachments, foreign, orphanReferrers, orphanJournal, drift, split, repositoryUnknown, repairedReferrers, errors, truncated]
          properties:
            repo: {type: string, description: "The repo, <format>/<name>."}
            ociRepositories: {type: integer, description: "The OCI repositories under the repo's path."}
            manifests: {type: integer, description: The tags read.}
            added: {type: integer, description: "The rows written, of versions and journal entries, that the index did not have."}
            updated: {type: integer, description: "The rows read again, with verify or degraded, and written."}
            unchanged: {type: integer, description: The rows seen with the digest the index has.}
            removed: {type: integer, description: "The rows removed, their manifests gone from the registry (prune)."}
            pending:
              description: >-
                The rows whose manifest the registry answered unknown (prune), kept until it answers
                so twice at least 10 minutes apart and the row is reconcile.graceAge old
                (docs/spec/guarantees.md, INV-5).
              type: integer
            deletedPending:
              description: >-
                The tags the registry still lists whose manifests were deleted through Lajstrom
                less than reconcile.graceAge before the run, on a registry not classified strong:
                not indexed again.
              type: integer
            degraded: {type: integer, description: "The versions written from their annotations, their metadata layer unreadable."}
            referrers: {type: integer, description: "The referrers listed, each digest once."}
            attachments: {type: integer, description: The attachment rows of the versions seen or written.}
            foreign:
              description: "The manifests under the repo's path that are not Lajstrom's: never indexed, never served."
              type: array
              items: {$ref: "#/components/schemas/ReindexFinding"}
            orphanReferrers:
              description: The referrers whose subject no version has.
              type: array
              items: {$ref: "#/components/schemas/ReindexFinding"}
            orphanJournal:
              description: >-
                The npm and pypi journal entries of an OCI repository without versions
                (docs/spec/manifest-profile.md §8): not indexed, adopted by the next append to the
                package.
              type: [array, "null"]
              items: {$ref: "#/components/schemas/ReindexFinding"}
            drift:
              description: The tags that name another digest in the registry than in the index.
              type: array
              items: {$ref: "#/components/schemas/ReindexDrift"}
            split:
              description: >-
                The packages found at two forms of their OCI name (ADR 0017), one entry per other
                form.
              type: [array, "null"]
              items: {$ref: "#/components/schemas/ReindexSplit"}
            repositoryUnknown:
              description: >-
                The versions of the index whose OCI repository the registry does not know: prune
                keeps their rows, a delete through the API removes them.
              type: [array, "null"]
              items: {$ref: "#/components/schemas/ReindexRepositoryUnknown"}
            repairedReferrers:
              description: >-
                The sha256-<hex> indexes that lacked referrers the audit log has as pushed and the
                registry still has, or were missing, and that Lajstrom pushed again with them: runs of
                the reconcile loop and with verify, on a registry without the referrers API.
              type: [array, "null"]
              items: {$ref: "#/components/schemas/RepairedReferrersIndex"}
            errors:
              description: What the run could not read, check or write, each with its error.
              type: array
              items: {$ref: "#/components/schemas/ReindexFinding"}
            truncated: {type: boolean, description: A list stopped at 1000 entries.}
    RepairedReferrersIndex:
      description: A subject's sha256-<hex> index that a reindex run pushed again with the referrers it lacked.
      type: object
      required: [repository, subject, index, added]
      properties:
        repository: {type: string, description: "The OCI repository of the subject, below the repo's base."}
        subject: {type: string}
        index: {type: string, description: The digest of the index pushed.}
        added:
          description: The referrers it lacked, in the order of their pushes.
          type: array
          items: {type: string}
    ReindexFinding:
      description: A manifest, or a failure, that a reindex report lists; a key without a value is left out.
      type: object
      required: [repository]
      properties:
        repository: {type: string, description: "The OCI repository, below the repo's base; empty for a failure of the whole repo."}
        tag: {type: string}
        digest: {type: string}
        mediaType: {type: string}
        artifactType: {type: string}
        subject: {type: string, description: The digest of a referrer's subject.}
        error: {type: string, description: What failed (errors).}
    ReindexDrift:
      description: A tag that names another digest in the registry than in the index; the index keeps its digest.
      type: object
      required: [package, tag, index, registry]
      properties:
        package: {type: string}
        tag: {type: string}
        index: {type: string, description: The digest the index has.}
        registry: {type: string, description: The digest the registry's tag names.}
    ReindexSplit:
      description: >-
        A package whose manifests are at two forms of its OCI name (ADR 0017): the index has the
        package at indexed; a run copies or moves nothing in the registry.
      type: object
      required: [package, indexed, indexedTags, other, otherTags]
      properties:
        package: {type: string}
        indexed: {type: string, description: "The package's OCI name in the index, below the repo's base."}
        indexedTags:
          description: The tags of its versions in the index.
          type: array
          items: {type: string}
        other: {type: string, description: "The other form, below the repo's base."}
        otherTags:
          description: The tags of the profile manifests at the other form.
          type: array
          items: {type: string}
    ReindexRepositoryUnknown:
      description: >-
        A version of the index whose OCI repository the registry does not know: its tag does not
        resolve, its manifest by digest and the repository's tag list are a 404 without
        MANIFEST_UNKNOWN. The row stays until it is deleted through the API or the repository
        comes back; a run deletes nothing in the registry.
      type: object
      required: [repository, package, version, tag, digest, delete]
      properties:
        repository: {type: string, description: "The OCI repository, below the repo's base."}
        package: {type: string}
        version: {type: string}
        variant: {type: string, description: The variant of a version with variants.}
        tag: {type: string}
        digest: {type: string}
        delete:
          description: >-
            The request that deletes the version's rows, the variant alone when it has one:
            DELETE /api/v1/repos/<format>/<name>/packages/<package>/versions/<version>, with
            ?variant=<variant> for a variant, the package and the version path-escaped.
          type: string
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: {$ref: "#/components/schemas/Session"}
        next: {type: string, description: The cursor of the next page; absent on the last.}
    Session:
      type: object
      description: An open publication session (docs/api.md, Open deploys).
      required: [id, key, principal, files, committing, createdAt, updatedAt, expiresAt]
      properties:
        id: {type: integer}
        key: {type: string, description: "<groupId>:<artifactId>:<version>; a SNAPSHOT build's version is the build's."}
        principal: {type: string, description: "Who opened it: user:<uid> or token:<id>."}
        principalName: {type: string, description: A user's name now; absent for a token.}
        files:
          type: array
          description: The files stored so far, in the order they first came.
          items:
            type: object
            required: [name, digest, size]
            properties:
              name: {type: string, description: The path below the repo.}
              digest: {type: string}
              size: {type: integer}
        refused:
          type: object
          description: The files a checksum file disagreed with, by name, with the reason; absent when none.
          additionalProperties: {type: string}
        committing: {type: boolean, description: A commit of the session runs.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time, description: Its last change.}
        expiresAt: {type: string, format: date-time, description: When it ends with nothing published unless it commits.}
    Token:
      type: object
      required: [id, kind, name, scopes, expiresAt, lastUsedAt, createdAt, revokedAt, hashPrefix]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [pat, deploy]}
        user: {type: string, description: The owner of a personal access token.}
        repo: {type: string, description: The <format>/<name> of a deploy token of one repo.}
        repoMask: {type: string, description: "The mask of a deploy token over a mask, oci/* or */talos."}
        name: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [read, write, attach]}
        expiresAt: {type: [string, "null"], format: date-time}
        lastUsedAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: [string, "null"], format: date-time}
        hashPrefix: {type: string}
        dpopJkt:
          type: string
          description: >-
            The JWK SHA-256 thumbprint (RFC 7638) of the DPoP key that the token of a web UI's
            sign-in is bound to; absent for every other token. A bound token works only as
            Authorization: DPoP with a proof of that key, on /api/.
    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: Shown this once.}
    LoginToken:
      allOf:
        - $ref: "#/components/schemas/CreatedToken"
        - type: object
          required: [dpopJkt, tokenType]
          properties:
            tokenType: {type: string, enum: [DPoP], description: "The token_type of RFC 9449 §5: the token is bound to the proof's key."}
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: {$ref: "#/components/schemas/Token"}
    TokenPage:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: {$ref: "#/components/schemas/Token"}
        next: {type: string, description: The cursor of the next page; absent on the last.}
    TokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [read, write, attach]}
        expiresAt: {type: string, format: date-time}
        expiresIn: {type: string, description: A number of days (30d) or a duration (12h).}
    MaskTokenRequest:
      type: object
      required: [repoMask, name, scopes]
      additionalProperties: false
      properties:
        repoMask: {type: string, description: "<format>/<repo>, each segment a name or * for any: oci/*, */talos."}
        name: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [read, write, attach]}
        expiresAt: {type: string, format: date-time}
        expiresIn: {type: string, description: A number of days (30d) or a duration (12h).}
    User:
      type: object
      required: [uid, name, kind, disabled, createdAt]
      properties:
        uid: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [local, oidc, service], description: "service: a service account (docs/spec/rbac.md §1)."}
        disabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        owner: {type: string, description: "A service account's owner, user:<uid> or group:<name>; absent for every other kind."}
        ownerName: {type: string, description: The name of a user owner.}
        ownerDisabled: {type: boolean, description: "A user owner is disabled; the service account is not, for that, unless auth.serviceAccounts.onOwnerDisabled is disable."}
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: {$ref: "#/components/schemas/User"}
        next: {type: string}
    UserRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: A local user needs a password; a service account (kind service) needs an owner, and has neither a password nor admin.
      properties:
        name: {type: string}
        password: {$ref: "#/components/schemas/Password"}
        admin: {type: boolean}
        kind: {type: string, enum: [local, service], default: local}
        owner: {type: string, description: "A service account's owner: user:<name> or user:<uid> of a user that is not a service account, or group:<name>."}
    BootstrapRequest:
      type: object
      required: [token, name, password]
      additionalProperties: false
      properties:
        token: {type: string}
        name: {type: string}
        password: {$ref: "#/components/schemas/Password"}
    LoginRequest:
      description: "The body of a sign-in: a local user's name and password, or the code of an OIDC login and its PKCE verifier."
      oneOf:
        - type: object
          required: [username, password]
          additionalProperties: false
          properties:
            username: {type: string}
            password: {type: string}
        - type: object
          required: [code, codeVerifier]
          additionalProperties: false
          properties:
            code: {type: string, description: "The code in the fragment of the page the callback redirected to, #code=<code>."}
            codeVerifier:
              type: string
              description: The PKCE verifier (RFC 7636) whose S256 challenge started the login.
              pattern: "^[A-Za-z0-9._~-]{43,128}$"
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string}
        disabled: {type: boolean}
        owner: {type: string, description: "A service account's new owner, as in UserRequest; 400 for a user of another kind."}
    PasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: {$ref: "#/components/schemas/Password"}
    Password:
      type: string
      minLength: 8
      maxLength: 1024
      description: A password of 8 to 1024 bytes of UTF-8; the server counts bytes, and the lengths here count characters.
    Binding:
      type: object
      required: [id, principal, role, repoMask, createdAt]
      properties:
        id: {type: integer, format: int64}
        principal: {type: string, description: "user:<uid>, group:<name> (docs/spec/rbac.md §8), or a cert: or k8s: principal or pattern (§9)."}
        name: {type: string, description: "The user's name now; absent for a group."}
        role: {type: string, enum: [reader, attacher, writer, maintainer, admin]}
        repoMask: {type: string}
        createdAt: {type: string, format: date-time}
    BindingList:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items: {$ref: "#/components/schemas/Binding"}
        next: {type: string}
    BindingRequest:
      type: object
      required: [principal, role, repoMask]
      additionalProperties: false
      properties:
        principal: {type: string, description: "user:<name>, user:<uid>, or group:<name>, which need not have members (docs/spec/rbac.md §8); or a cert: or k8s: principal or pattern, never with the admin role (§9)."}
        role: {type: string, enum: [reader, attacher, writer, maintainer, admin]}
        repoMask: {type: string}
    AuditEntry:
      type: object
      required: [id, at, principal, action, state]
      properties:
        id: {type: integer, format: int64}
        at: {type: string, format: date-time}
        principal: {type: string}
        principalName: {type: string}
        principalKind: {type: string, enum: [service], description: "service when the principal is a service account's user:<uid>; absent otherwise."}
        action: {type: string}
        repo: {type: string}
        subject: {type: string}
        digest: {type: string}
        ip: {type: string}
        details: {type: object}
        state: {type: string, enum: [ok, pending, failed, unknown]}
        error: {type: string, description: Why a failed row failed.}
    AuditList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/AuditEntry"}
        next: {type: string}
    Package:
      description: A package with the facts of its manifests, all read from the index.
      type: object
      required: [name, nameOci, createdAt, updatedAt, latestVersion, latestVariants, lastPublished, versions, manifests, size, summary, attrs,
        pointers]
      properties:
        name: {type: string, description: The name in the format's spelling.}
        nameOci: {type: string, description: The escaped package path of its OCI repository.}
        createdAt: {type: string, format: date-time, description: The publish time of its first manifest.}
        updatedAt: {type: string, format: date-time, description: The publish time of its newest manifest.}
        latestVersion:
          type: [string, "null"]
          description: >-
            The version the format's client installs by default: npm the latest dist-tag, maven the release of
            maven-metadata.xml, pypi the highest that is not a pre-release and not yanked (as pip picks it), apt and
            rpm the highest by dpkg's and rpm's order, raw the newest; null when the client installs none.
        latestVariants:
          type: array
          description: The variants of the latest version in byte order; empty for a format without variants and without a latest version.
          items: {type: string}
        lastPublished:
          type: [string, "null"]
          description: The first version of its versions list, the newest by its first publish time; null without versions.
        versions: {type: integer, format: int64, description: How many versions it has.}
        manifests: {type: integer, format: int64, description: "How many manifests it has, one per variant of each version."}
        size: {type: integer, format: int64, description: "The sizes of the file layers of all its manifests, added up."}
        summary:
          type: [string, "null"]
          description: >-
            One line of the head manifest's metadata layer (pypi summary, deb Description, npm description,
            rpm summary); null when it has none.
        attrs:
          type: object
          description: >-
            The lajstrom.* annotations of the head manifest, the latest version's first variant (else the last
            published one's), by their full key.
          additionalProperties: {type: string}
        pointers:
          type: array
          description: "Its pointers that name one of its versions, with the version, by kind and name: npm's dist-tags."
          items: {$ref: "#/components/schemas/PackagePointer"}
    PackagePointer:
      description: A pointer of a package, with the version it names.
      allOf:
        - {$ref: "#/components/schemas/Pointer"}
        - type: object
          required: [version]
          properties:
            version: {type: string, description: The version it names.}
    PackageDetail:
      description: "One package: its row of the package list, its OCI repository and the metadata of its head manifest."
      allOf:
        - {$ref: "#/components/schemas/Package"}
        - type: object
          required: [ociRepository, latestMetadata]
          properties:
            ociRepository:
              type: string
              description: <format>/<repo>/<package path>, the repository of its manifests on /v2.
            latestMetadata:
              type: [object, "null"]
              description: The metadata layer of the head manifest; null when it is absent or was too large to keep.
    PackageList:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items: {$ref: "#/components/schemas/Package"}
        facets:
          type: object
          description: >-
            With facet only: for each key, its values in the repo's manifests in byte order, at
            most 1000.
          additionalProperties:
            type: array
            items: {$ref: "#/components/schemas/FacetValue"}
        next: {type: string}
    SearchResult:
      description: A page of the hits of a search, rank after rank.
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            oneOf:
              - {$ref: "#/components/schemas/PackageHit"}
              - {$ref: "#/components/schemas/VersionHit"}
        next: {type: string}
    PackageHit:
      description: A package found by its name or a summary, with the facts of its row of the package list.
      type: object
      required: [kind, format, repo, name, latestVersion, summary, updatedAt]
      properties:
        kind: {const: package}
        format: {type: string}
        repo: {type: string}
        name: {type: string}
        latestVersion: {type: [string, "null"]}
        summary: {type: [string, "null"]}
        updatedAt: {type: string, format: date-time}
    VersionHit:
      description: A manifest found by its digest, or by the digest of one of its file layers.
      type: object
      required: [kind, format, repo, name, version, variant, digest, matched]
      properties:
        kind: {const: version}
        format: {type: string}
        repo: {type: string}
        name: {type: string}
        version: {type: string}
        variant: {type: string, description: Empty for a format without variants.}
        digest: {type: string, description: The manifest's digest.}
        matched: {type: string, enum: [manifest, file], description: Whose digest matched.}
        file:
          description: The file whose digest matched; with matched file only.
          type: object
          required: [name, digest]
          properties:
            name: {type: string}
            digest: {type: string}
    FacetValue:
      description: A value of an attribute in the repo's manifests.
      type: object
      required: [value, count]
      properties:
        value: {type: string}
        count: {type: integer, format: int64, description: How many packages have a manifest with the value.}
    Version:
      type: object
      required: [version, publishedAt, lastModified, variants, pointers]
      properties:
        version: {type: string}
        publishedAt:
          type: string
          format: date-time
          description: The publish time of its first variant, from the manifest; the order of the list.
        lastModified:
          type: string
          format: date-time
          description: The publish time of its newest variant, which If-Unmodified-Since and the cut-off compare.
        variants:
          type: array
          items: {$ref: "#/components/schemas/Variant"}
        pointers:
          type: array
          description: What names the version and moves; a conditional delete refuses it unless forced.
          items: {$ref: "#/components/schemas/Pointer"}
        yanked: {$ref: "#/components/schemas/Yank"}
    Yank:
      description: The yank of a pypi version (PEP 592); absent when the version is not yanked.
      type: object
      required: [reason]
      properties:
        reason: {type: string, description: Empty when the yank gave none.}
    Rule:
      description: A policy rule (docs/spec/policy.md §1).
      type: object
      required: [id, repoMask, name, version, variant, effect, reason, createdBy, createdAt, expiresAt, expired]
      properties:
        id: {type: integer}
        repoMask: {type: string, description: "A repo mask, <format>/<repo>, each * or a name."}
        name: {type: string, description: "A pattern of the package name; * any run of characters."}
        version: {type: string, description: "A version constraint: *, or clauses ==, !=, <, <=, >, >= joined with commas."}
        variant: {type: string, description: "A pattern of the variant; * every variant."}
        effect: {type: string, enum: [deny, allow]}
        reason: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, "null"], format: date-time}
        expired: {type: boolean}
    RuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: {$ref: "#/components/schemas/Rule"}
    RuleRequest:
      description: The body of a rule's creation.
      type: object
      required: [repoMask, name, reason]
      properties:
        repoMask: {type: string}
        name: {type: string, maxLength: 256}
        version: {type: string, description: "* when absent."}
        variant: {type: string, maxLength: 256, description: "* when absent; empty for the empty variant only."}
        effect: {type: string, enum: [deny, allow], description: "deny when absent."}
        reason: {type: string, minLength: 1, maxLength: 512}
        expiresAt: {type: [string, "null"], format: date-time}
    Verdict:
      description: A verdict the index holds (docs/spec/policy.md §2).
      type: object
      required: [repo, package, subject, attestation, verdict, reason, source, scope, validUntil, signedBy, createdAt, inForce]
      properties:
        repo: {type: string}
        package: {type: string}
        version: {type: string}
        variant: {type: string}
        subject: {type: string, description: "The judged manifest's digest."}
        attestation: {type: string, description: "The referrer's digest."}
        verdict: {type: string, enum: [allow, deny, quarantine]}
        reason: {type: string}
        source: {type: string}
        scope: {type: string}
        validUntil: {type: [string, "null"], format: date-time}
        signedBy: {type: string}
        createdAt: {type: [string, "null"], format: date-time}
        inForce: {type: boolean}
    VerdictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Verdict"}
    Denylist:
      description: The deny list (docs/spec/policy.md §8).
      type: object
      required: [version, generation, createdAt, rules, verdicts, digests, prefixes]
      properties:
        version: {type: integer}
        generation: {type: integer}
        createdAt: {type: string, format: date-time}
        rules:
          type: array
          items: {type: object}
        verdicts:
          type: array
          items: {type: object}
        digests:
          type: array
          items: {type: string}
        prefixes:
          type: array
          items: {type: string}
    DenyRequest:
      description: The body of a deny.
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 512}
        validUntil: {type: [string, "null"], format: date-time}
    YankRequest:
      description: The optional body of a yank.
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 4096
          description: Why the version is yanked, at most 4096 bytes of UTF-8; absent, null or empty for none.
    Variant:
      description: One manifest of a version with its facts, from the index.
      type: object
      required: [variant, tag, digest, publishedAt, artifactType, attrs, degraded, size, fileCount, attachments]
      properties:
        variant: {type: string, description: Empty for a format without variants.}
        tag: {type: string}
        digest: {type: string, description: "The manifest digest, the entity tag of If-Match."}
        publishedAt: {type: string, format: date-time}
        artifactType: {type: string}
        attrs:
          type: object
          description: The manifest's lajstrom.* annotations by their full key.
          additionalProperties: {type: string}
        degraded: {type: boolean, description: The row came from the annotations alone; its metadata layer could not be read.}
        size: {type: integer, format: int64, description: The sizes of its file layers added up.}
        fileCount: {type: integer, format: int64, description: The number of its file layers.}
        attachments: {$ref: "#/components/schemas/AttachmentCounts"}
    AttachmentCounts:
      description: >-
        The attachments of a variant counted by kind, as GET …/attachments?variant=&kind= lists
        them; every kind is there, 0 without attachments, and a kind of a newer server is counted
        under its own name.
      type: object
      required: [signature, sbom, scan, provenance, attestation, other]
      properties:
        signature: {type: integer, format: int64}
        sbom: {type: integer, format: int64}
        scan: {type: integer, format: int64}
        provenance: {type: integer, format: int64}
        attestation: {type: integer, format: int64}
        other: {type: integer, format: int64}
      additionalProperties: {type: integer, format: int64}
    Pointer:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [dist-tag]}
        name: {type: string}
    VersionDetail:
      description: "One version: its row of the version list, its variants in detail and its OCI repository."
      type: object
      required: [version, publishedAt, lastModified, variants, pointers, ociRepository]
      properties:
        version: {type: string}
        publishedAt:
          type: string
          format: date-time
          description: The publish time of its first variant, whatever variant keeps.
        lastModified:
          type: string
          format: date-time
          description: The publish time of its newest variant, whatever variant keeps.
        variants:
          type: array
          items: {$ref: "#/components/schemas/VariantDetail"}
        pointers:
          type: array
          items: {$ref: "#/components/schemas/Pointer"}
        yanked: {$ref: "#/components/schemas/Yank"}
        ociRepository:
          type: string
          description: "The ociRepository of its first variant: <format>/<repo>/<package path>, the repository of its manifest on /v2."
    AttachmentList:
      description: The attachments of a version, newest first.
      type: object
      required: [attachments, truncated]
      properties:
        attachments:
          type: array
          items: {$ref: "#/components/schemas/Attachment"}
        truncated:
          type: boolean
          description: There are more attachments than the limit; the oldest are left out.
    Attachment:
      description: >-
        One attachment of a version: one layer of a referrer of one of its variants, with its label
        (docs/spec/manifest-profile.md §6).
      type: object
      required: [variant, subject, digest, layer, mediaType, artifactType, kind, predicateType, size, annotations, verification, indexedAt]
      properties:
        variant: {type: string, description: Empty for a format without variants.}
        subject: {type: string, description: The variant's manifest digest.}
        digest: {type: string, description: The referrer manifest's digest.}
        tag: {type: string, description: "cosign's legacy tag, sha256-<hex>.sig, .att or .sbom; absent for a referrer pushed by digest."}
        layer: {type: string, description: The digest of the attachment's layer; empty for a manifest without layers.}
        mediaType: {type: string, description: The layer's media type.}
        artifactType: {type: string, description: "The referrer's artifactType, else its config's media type."}
        kind:
          type: string
          description: What it is; a value this list does not name is shown as it is.
          enum: [signature, sbom, scan, provenance, attestation, other]
        predicateType: {type: string, description: The predicate type of its statement or cosign's annotation; empty when none.}
        size: {type: integer, format: int64, description: The layer's size.}
        annotations:
          type: object
          description: The referrer manifest's annotations.
          additionalProperties: {type: string}
        tool: {type: string, description: "lajstrom.attachment.tool, when set."}
        toolVersion: {type: string, description: "lajstrom.attachment.toolVersion, when set."}
        database: {type: string, description: "lajstrom.attachment.database, when set."}
        input: {type: string, description: "lajstrom.attachment.input, the SBOM a scan was computed from, when it is a digest."}
        verification:
          type: string
          description: >-
            verified (a trusted key or keyless identity signed it, for its predicate type, and what it
            signed names the variant), untrusted, unsigned, invalid or unsupported (keyless without
            attachments.keyless, cosign's legacy keyless layers, notation, a message signature, a
            layer above attachments.maxBlobSize).
          enum: [verified, untrusted, unsigned, invalid, unsupported]
        signedBy: {type: string, description: The name of the key or keyless identity that verified it.}
        reason: {type: string, description: Why it is not verified.}
        createdAt: {type: string, format: date-time, description: "The referrer's org.opencontainers.image.created, when it has one."}
        indexedAt: {type: string, format: date-time, description: When ingest or reindex last wrote or saw the row.}
    ManifestList:
      description: The manifests of a version's variants, read from the registry.
      type: object
      required: [manifests]
      properties:
        manifests:
          type: array
          items: {$ref: "#/components/schemas/Manifest"}
    Manifest:
      description: The manifest of one variant.
      type: object
      required: [variant, digest, mediaType, size, manifest]
      properties:
        variant: {type: string, description: Empty for a format without variants.}
        digest: {type: string, description: "The manifest digest, the index's."}
        mediaType: {type: string}
        size: {type: integer, format: int64}
        manifest:
          type: object
          description: "The manifest as JSON; its exact bytes are /v2/<ociRepository>/manifests/<digest>."
    ReferrerList:
      description: The referrers of a version's variants, as the registry lists them.
      type: object
      required: [referrers]
      properties:
        referrers:
          type: array
          items: {$ref: "#/components/schemas/Referrer"}
    Referrer:
      description: One manifest whose subject is a variant's manifest.
      type: object
      required: [variant, subject, digest, mediaType, artifactType, size, annotations]
      properties:
        variant: {type: string, description: Empty for a format without variants.}
        subject: {type: string, description: The variant's manifest digest.}
        digest: {type: string, description: The referrer manifest's digest.}
        mediaType: {type: string}
        artifactType: {type: string}
        size: {type: integer, format: int64}
        annotations:
          type: object
          description: The referrer manifest's annotations, as the registry lists them.
          additionalProperties: {type: string}
    VariantDetail:
      description: One manifest of a version, with its row of the index, its facts and its files.
      type: object
      required: [variant, tag, digest, publishedAt, artifactType, attrs, degraded, size, fileCount, attachments, metadata, indexedAt, files, ociRepository]
      properties:
        variant: {type: string, description: Empty for a format without variants.}
        tag: {type: string}
        digest: {type: string, description: The manifest digest.}
        publishedAt: {type: string, format: date-time}
        artifactType: {type: string}
        attrs:
          type: object
          description: The manifest's lajstrom.* annotations by their full key.
          additionalProperties: {type: string}
        degraded: {type: boolean, description: The row came from the annotations alone.}
        size: {type: integer, format: int64, description: The sizes of its file layers added up.}
        fileCount: {type: integer, format: int64, description: The number of its file layers.}
        attachments: {$ref: "#/components/schemas/AttachmentCounts"}
        metadata:
          description: The metadata layer; null when there is none or it was too large to keep.
          type: [object, "null"]
        indexedAt:
          type: string
          format: date-time
          description: When ingest or reindex last wrote or saw the row.
        files:
          type: array
          description: The file layers, in manifest order.
          items: {$ref: "#/components/schemas/File"}
        ociRepository:
          type: string
          description: >-
            <format>/<repo>/<package path>, the repository of its manifest on /v2: of a package split across
            two forms of its OCI name, the form where reindex found it (#642).
    File:
      description: One file layer of a manifest.
      type: object
      required: [name, mediaType, digest, size, attrs]
      properties:
        name: {type: string}
        mediaType: {type: string}
        digest: {type: string}
        size: {type: integer, format: int64}
        attrs:
          type: object
          description: The layer's annotations.
          additionalProperties: {type: string}
    VersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: {$ref: "#/components/schemas/Version"}
        next: {type: string}
    BatchDeleteRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/BatchDeleteItem"}
        cutoff:
          type: string
          format: date-time
          description: A version published after it is not deleted (young).
        dryRun:
          type: boolean
          description: Check every item and delete nothing; deleted then means it would be.
        job:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          description: The job id for the audit rows; a new one when absent.
    BatchDeleteItem:
      type: object
      required: [package, version, digests]
      additionalProperties: false
      properties:
        package: {type: string, description: The name in the format's spelling.}
        version: {type: string}
        digests:
          type: array
          minItems: 1
          description: The digests of every variant of the version, as the client read them.
          items: {type: string}
    BatchDeleteResult:
      type: object
      required: [job, dryRun, results]
      properties:
        job: {type: string, description: In details.job of every audit row of the batch.}
        dryRun: {type: boolean}
        results:
          type: array
          items: {$ref: "#/components/schemas/BatchDeleteItemResult"}
    BatchDeleteItemResult:
      type: object
      required: [package, version, status]
      properties:
        package: {type: string}
        version: {type: string}
        status:
          type: string
          enum: [deleted, changed, protected, young, gone, error]
        message: {type: string, description: "Why, for every status but deleted."}
        digests:
          type: array
          description: The digests of the version now, for changed.
          items: {type: string}
        lastModified:
          type: string
          format: date-time
          description: The publish time of its newest variant, for young.
        pointers:
          type: array
          description: What names the version, for protected.
          items: {$ref: "#/components/schemas/Pointer"}
    PrefetchRequest:
      type: object
      description: names and allVersions of a format's proxy repo; images and platforms of an oci one.
      additionalProperties: false
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 100
          description: Package names in the format's spelling.
          items: {type: string, minLength: 1}
        allVersions:
          type: boolean
          description: >-
            Every version the upstream lists; without it the versions its pointers name (npm's
            dist-tags), or the newest when they name none.
        images:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            References below an oci proxy repo, <path>[:<tag>][@<digest>]: latest without a tag
            or a digest, the digest when both are given.
          items: {type: string, minLength: 1}
        platforms:
          type: array
          description: >-
            The platforms of an index to fetch, os/architecture[/variant]; required for a
            reference that names an index, not used for one that names a manifest.
          items: {type: string, minLength: 1}
    PrefetchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/PrefetchItemResult"}
    PrefetchItemResult:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        version: {type: string, description: Absent for a name that failed before its versions.}
        variant: {type: string}
        status:
          type: string
          enum: [fetched, held, shared, failed]
          description: >-
            fetched by this request; held already; shared, fetched meanwhile by another request
            or replica; failed.
        httpStatus:
          type: integer
          description: For failed, the status a request of the file would have had.
        message: {type: string, description: "Why, for failed."}
        kind:
          type: string
          enum: [index, manifest, blob]
          description: >-
            Of an oci repo: what a reference names, an index or a manifest; a platform's
            manifest; a blob. Absent for an image that failed before what it names was known.
        platform: {type: string, description: "Of an oci repo, the platform of a manifest or a blob of an index."}
        digest: {type: string, description: "Of an oci repo, the digest of the index, manifest or blob."}
        bytes:
          type: integer
          format: int64
          description: Of an oci repo, what the request got from the upstream; a manifest's with its blobs.
        retryAfter:
          type: integer
          description: For a failed 503, when to ask again, in seconds.
    Whoami:
      type: object
      required: [principal, kind, name]
      properties:
        principal: {type: string}
        kind: {type: string, enum: [user, token]}
        name: {type: string}
        uid: {type: string, format: uuid}
        groups:
          type: array
          items: {type: string}
          description: A user's groups that count now, from its latest OIDC login (docs/spec/rbac.md §8).
    RegistryList:
      type: object
      required: [replica, registries]
      properties:
        replica: {type: string, description: "The replica that answers, as replicas.id names it: host name and process id."}
        registries:
          type: array
          items: {$ref: "#/components/schemas/Registry"}
    Registry:
      type: object
      required: [name, type, url, prefix, vendor, support, capabilities, repos, status]
      properties:
        name: {type: string}
        type: {type: string, enum: [generic, ecr]}
        url: {type: string}
        prefix: {type: string}
        vendor:
          type: [string, "null"]
          description: >-
            The product the probe detected, as lajstrom registry probe names it (distribution, zot,
            gitlab, ghcr, harbor, nexus, gitea, forgejo, jfrog, quay, dockerhub, ecr, or unknown); null
            before a probe of the replica got an answer.
        support:
          type: [string, "null"]
          enum: [ci, manual, hosted, untested, null]
          description: The vendor's support tier in this release (docs/registries/README.md, Support tiers); null with vendor.
        capabilities:
          anyOf:
            - {$ref: "#/components/schemas/Capabilities"}
            - {type: "null"}
          description: "What ingest and the facade go by; null before a probe of the replica succeeded."
        repos:
          type: array
          description: "The repos on the registry, <format>/<name>, by format and name."
          items: {type: string}
        status: {$ref: "#/components/schemas/RegistryStatus"}
    Capabilities:
      type: object
      description: A registry's capabilities, under the keys of registries[].capabilities (docs/configuration.md).
      required: [createOnPush, referrers, catalog, deleteManifest, immutableTags, blobRedirect, referrersAlwaysTag, maxBlobSize,
        consistency, consistencyBound, maxNameDepth, maxNameLength, tagsFoldCase, buildRoutes]
      properties:
        createOnPush: {type: boolean}
        referrers: {type: boolean}
        catalog: {type: boolean}
        deleteManifest: {type: boolean}
        immutableTags: {type: boolean}
        blobRedirect: {type: boolean}
        referrersAlwaysTag: {type: boolean}
        maxBlobSize: {type: integer, description: Bytes; 0 when unknown.}
        consistency: {type: string, enum: [strong, eventual, ""], description: "\"\" when unknown."}
        consistencyBound: {type: string, description: "A duration, 2m10s; 0s when none is known."}
        maxNameDepth: {type: integer, description: 0 for no limit.}
        maxNameLength: {type: integer, description: 0 for no limit.}
        tagsFoldCase: {type: boolean}
        buildRoutes: {type: boolean}
    RegistryStatus:
      type: object
      description: What the replica's readiness ping (GET /v2/ every 20 seconds) and the registry's circuit breaker know.
      required: [state, checkedAt, answeredAt, latencyMs, message, breaker]
      properties:
        state:
          type: string
          enum: [ok, degraded, down]
          description: "down: no ping answered 200 for a minute, or the breaker is open; degraded: the last ping failed, or the breaker is half-open."
        checkedAt: {type: [string, "null"], format: date-time, description: "The last ping; null before the first, and for a provider that is not pinged."}
        answeredAt: {type: [string, "null"], format: date-time, description: The last ping answered 200.}
        latencyMs: {type: [integer, "null"], description: How long the last ping took.}
        message: {type: [string, "null"], description: "The error of the last ping, as the provider words it: no credential, no instance prefix."}
        breaker: {type: string, enum: [closed, open, half-open]}
    Info:
      description: "What a client needs before it signs in, and the caller."
      type: object
      required: [version, commit, date, externalURL, anonymousRead, formats, authModes, login, caller]
      properties:
        version: {type: string, description: The release version; dev for an unversioned build.}
        commit: {type: string, description: The short commit hash; empty when unknown.}
        date: {type: string, description: The build time in RFC 3339; empty when unknown.}
        externalURL: {type: string, description: "server.externalURL; empty on the dev stack when it leaves it empty."}
        anonymousRead: {type: boolean, description: "auth.anonymousRead, the server-wide switch."}
        formats:
          type: array
          description: The format plugins the server serves, by name; oci repos need none.
          items: {$ref: "#/components/schemas/FormatInfo"}
        authModes:
          type: array
          description: How a person signs in; oidc while the OIDC login is on.
          items: {type: string, enum: [password, token, oidc]}
        login:
          description: >-
            POST /api/v1/login, whose token is DPoP-bound, which a server before it does not
            answer; with oidc in authModes, /-/oidc/login takes return_to, code_challenge and
            dpop_jkt for a web UI.
          type: object
          required: [tokenLifetime]
          properties:
            tokenLifetime: {type: integer, description: "The seconds of auth.login.tokenLifetime."}
        caller: {$ref: "#/components/schemas/Caller"}
    FormatInfo:
      description: "A format plugin the server serves, and the artifact type of its manifests."
      type: object
      required: [name, artifactType]
      properties:
        name: {type: string}
        artifactType: {type: string}
    Caller:
      description: "The request's principal as whoami answers it, or anonymous, and whether its credential reaches the admin role."
      type: object
      required: [principal, kind, name, admin]
      properties:
        principal: {type: string}
        kind: {type: string, enum: [user, token, anonymous]}
        name: {type: string}
        uid: {type: string, format: uuid}
        admin: {type: boolean, description: Whether the request's credential reaches the admin role.}
    Webhook:
      type: object
      required: [id, mask, url, events, active, description, createdBy, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        mask: {type: string, description: "A repo mask of rbac.md §3, such as apt/ubuntu-internal, apt/* or */*."}
        url: {type: string}
        events:
          type: array
          description: The types it gets; empty, every type.
          items: {type: string, enum: [version.published, version.deleted, repo.created, repo.deleted]}
        active: {type: boolean}
        description: {type: string}
        createdBy: {type: string, description: The principal that created it.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: "whsec_ and the base64 of the key: shown this once."}
    WebhookList:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items: {$ref: "#/components/schemas/Webhook"}
    WebhookRequest:
      type: object
      additionalProperties: false
      description: >-
        Create: url is required, and under /api/v1/webhooks the mask too; active is true by
        default. Change: the fields given change; a mask is refused.
      properties:
        mask: {type: string}
        url: {type: string, maxLength: 2048}
        events:
          type: array
          items: {type: string, enum: [version.published, version.deleted, repo.created, repo.deleted]}
        active: {type: boolean}
        description: {type: string, maxLength: 256}
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret: {type: string, description: Shown this once.}
    Delivery:
      type: object
      required: [id, eventId, eventType, state, attempts, createdAt]
      properties:
        id: {type: integer, format: int64}
        eventId: {type: string, description: "The CloudEvents id, the same on every attempt."}
        eventType: {type: string}
        state: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer}
        nextAt: {type: string, format: date-time, description: When a pending delivery is due.}
        lastAt: {type: string, format: date-time}
        lastStatus: {type: integer, description: The status of the last answer; absent when none came.}
        lastError: {type: string, description: "Lajstrom's words, never the receiver's body."}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: string, format: date-time}
    DeliveryList:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items: {$ref: "#/components/schemas/Delivery"}
        next: {type: string, description: The cursor of the next page; absent on the last.}
