// The Gradle library of test/e2e/maven.sh: gradle publish (maven-publish) sends the jar, the pom
// and the Gradle module metadata (.module), each with .md5, .sha1, .sha256 and .sha512, then
// maven-metadata.xml. group and version are in gradle.properties; maven.sh passes those of the
// run with -P, and the repository with -Pe2eUrl= and the credentials of the repository named
// lajstrom, lajstromUsername and lajstromPassword, in gradle.properties of its copy.
plugins {
    id 'java-library'
    id 'maven-publish'
}

// The same bytes on every build.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        lib(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'lajstrom'
            url = providers.gradleProperty('e2eUrl').getOrElse('http://localhost:8080/maven/releases')
            allowInsecureProtocol = url.scheme == 'http'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication) // preemptive: no request goes out without the token
            }
        }
    }
}
