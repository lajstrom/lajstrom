# The master keys of a replacement (docs/operations.md, Replacing the master key): the variable
# LAJSTROM_MASTER_KEY and a Kubernetes Secret with a data key per master key, mounted whole as
# keys.masterKeyDir, group-readable through fsGroup by the image's user 65532.
# make helm-lint renders the chart with this file too.
masterKey:
  dir:
    volume:
      secret:
        secretName: lajstrom-master-keys
        defaultMode: 0440
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
