# Values of the Lajstrom chart. docs/deploy/helm.md has the reference and the install; the
# defaults render the deployment of deploy/kubernetes. No secret goes in here: the master key,
# the database DSN and the registry passwords come from Secrets you make, named below.

image:
  repository: ghcr.io/lajstrom/lajstrom
  # Empty: the chart's appVersion.
  tag: ""
  # sha256:…, pinned beside the tag: the node pulls the digest.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# lajstrom.yaml, mounted at /etc/lajstrom/lajstrom.yaml (docs/configuration.md). The chart sets
# these keys itself, over whatever this map says: server.listen (":8080"), server.metricsListen
# (with metrics.enabled), database.driver (postgres), keys.masterKeyEnv (LAJSTROM_MASTER_KEY) and
# auth.bootstrap.tokenFile (with bootstrap.enabled). Helm merges maps and replaces lists: a list
# of your values replaces the one below, and null removes a key of the defaults.
config:
  server:
    # The public URL of the edge. The realm of the bearer challenge of /v2 is built from it.
    externalURL: "https://art.example.com"
    # The range the edge connects to the pods from. While it is empty, Lajstrom takes the edge
    # for the client: the per-address throttles are off and the logs record the edge's address
    # (docs/deploy/kubernetes.md, 2. The configuration).
    # trustedProxies: ["<the range your edge connects from>"]
  log:
    format: json
  registries:
    - name: main
      url: "https://registry.example.com"
      prefix: "lajstrom/"
      auth:
        username: lajstrom
        # Set from the entry of registryPasswords with the same env.
        passwordEnv: LAJSTROM_REGISTRY_PASSWORD
  # Repos made at the start of a replica when the database does not have them
  # (docs/configuration.md, repos).
  # repos:
  #   - {name: assets, format: raw, registry: main}

# The master key, 64 hexadecimal characters (openssl rand -hex 32), as LAJSTROM_MASTER_KEY: every
# replica needs the same one. Keep a copy outside the cluster and apart from the database backups
# (docs/operations.md, The master key).
masterKey:
  # The Secret; empty is the release's full name, lajstrom for a release named lajstrom.
  existingSecret: ""
  key: LAJSTROM_MASTER_KEY

# The Postgres DSN, as LAJSTROM_DATABASE_DSN. The chart runs Postgres only: every replica
# shares it. CloudNativePG's Secret <cluster>-app holds one under the key uri.
database:
  existingSecret: ""
  key: LAJSTROM_DATABASE_DSN

# The password of each registries[].auth.passwordEnv of config, from a Secret: env is the
# variable that passwordEnv names. helm template fails on a passwordEnv no entry sets.
registryPasswords:
  - env: LAJSTROM_REGISTRY_PASSWORD
    existingSecret: ""
    key: LAJSTROM_REGISTRY_PASSWORD

# The one-time token that makes the first admin (docs/auth.md, Bootstrap: the first admin): a
# key of a Secret, mounted as the file /run/secrets/lajstrom-bootstrap/token of
# auth.bootstrap.tokenFile. The volume is optional: without the Secret serve starts and warns, and
# once the admin exists you delete the Secret and its file leaves the pods.
bootstrap:
  enabled: true
  # The Secret; empty is <full name>-bootstrap.
  existingSecret: ""
  key: token
  # true: the chart makes <full name>-bootstrap with a random token (#440) and keeps it across
  # upgrades with lookup. Not for tools that render with helm template, such as Argo CD: they
  # cannot look it up and make a new token on every render. Once the admin exists, set
  # bootstrap.enabled to false, which removes the Secret and its file.
  generate: false

# lajstrom migrate of the new release, as a pre-upgrade hook Job, before the Deployment gets the
# new image (docs/operations.md, Several replicas): a migration that fails, or one that would break
# the replicas serving, fails helm upgrade, and the old replicas keep serving. It reads the new
# configuration from a hook ConfigMap of its own. Not on helm rollback: the release before runs on
# the newer schema as kubectl rollout undo does. Without the Job, serve migrates at start, under
# the migration lock.
migrate:
  enabled: true
  # Also before the first install. Postgres must answer by then: an install that brings up its
  # database beside the chart fails.
  onInstall: false
  # The DSN of the Job, when serve runs as a database user with data rights only and the Job as
  # the schema's owner (docs/operations.md, A database user for serve); empty takes database's.
  database:
    existingSecret: ""
    key: ""
  # A migration that fails rolls back; read its log before running it again.
  backoffLimit: 0
  # A long migration takes what it takes: give helm upgrade a --timeout that covers it (5m by
  # default). activeDeadlineSeconds bounds the Job itself.
  activeDeadlineSeconds: null
  # Empty: the namespace's default ServiceAccount. The Job needs no identity, and a hook runs
  # before the chart's ServiceAccount exists on a first sync of Argo CD.
  serviceAccountName: ""
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

# The recovery of a lost password (docs/deploy/helm.md, A lost password), off while user is
# empty. helm upgrade --set recovery.user=admin runs lajstrom admin user set-password for that
# user, as a post-install and post-upgrade hook Job, with the password of a Secret; no kubectl
# exec. The Job runs on every upgrade while user is set, setting the password of the Secret again:
# set user back to "" once you are in, which removes the Secret the chart made.
recovery:
  user: ""
  # The Secret of the password; empty: the chart makes <full name>-recovery with 32 random
  # letters and digits, kept across upgrades with lookup. Name a Secret of your own for a tool
  # that renders with helm template, such as Argo CD, which cannot look it up.
  existingSecret: ""
  key: password
  # A retry covers a database that does not answer yet, or not migrated on a first install; a
  # user that does not exist fails every attempt, and the Job then fails the upgrade.
  backoffLimit: 2
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

# Every replica is the same: the state is in Postgres and in the registry.
replicaCount: 2
# A new replica starts before an old one stops; the old ones serve on the migrated schema
# meanwhile (docs/operations.md, Several replicas).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
# Must exceed server.shutdownDelay (5s) and server.shutdownTimeout (30s) together.
terminationGracePeriodSeconds: 40
revisionHistoryLimit: 10

# At most one replica down at a time for a drain or an upgrade of the nodes.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable replaces maxUnavailable when set.
  minAvailable: null

serviceAccount:
  create: true
  # Empty: the full name with create, the namespace's default without.
  name: ""
  # IRSA or EKS Pod Identity for a registry of type ecr or an upstream with auth.ecr:
  # eks.amazonaws.com/role-arn. GKE Workload Identity for an upstream with auth.gcp, when it acts
  # as a Google service account: iam.gke.io/gcp-service-account.
  annotations: {}
# Lajstrom never talks to the Kubernetes API.
automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

# The nonroot user of the distroless image (65532), which has no shell: the restricted Pod
# Security Standard (docs/deploy/kubernetes.md, Security context).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# serve applies the migrations and asks the registries (up to 20 s for one that does not answer)
# before it listens: the start gets a minute (docs/deploy/kubernetes.md, Probes).
startupProbe:
  httpGet: {path: /-/healthz, port: http}
  periodSeconds: 2
  failureThreshold: 30
# Only "the process answers": an outage of the database or a registry must not restart the pods.
livenessProbe:
  httpGet: {path: /-/healthz, port: http}
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# 503 while the database does not answer or a registry has not answered for a minute.
readinessProbe:
  httpGet: {path: /-/readyz, port: http}
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

# /tmp, the only writable path: a proxy repo's fetch and a /v2 chunk of a registry with
# uploads.spoolUnknownLength are spooled there for one request. Uploads stream and take none.
tmp:
  sizeLimit: 4Gi
  # Memory makes it a tmpfs, counted against the memory limit.
  medium: ""

service:
  type: ClusterIP
  # The port http; the edge routes the whole host to it.
  port: 8080
  annotations: {}

# An HTTPRoute of the Gateway API, the edge the docs run (docs/reverse-proxy.md, Gateway API): the
# whole host, without a path prefix or a rewrite, to the port http. The Gateway is the cluster's
# or one of your own, such as deploy/kubernetes/gateway/gateway.yaml; what Gateway API has no
# field for (body limits, idle timeouts, the path as sent) its implementation sets, e.g. Envoy
# Gateway's policies in extraObjects.
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  # The Gateway's listener, which must admit routes from this namespace; required.
  parentRefs: []
  #  - name: lajstrom
  #    sectionName: https
  # Empty: the host of config.server.externalURL.
  hostnames: []
  # No bound on a whole request (Standard since Gateway API v1.2.0): without it Envoy-based
  # implementations cut a response 15 s after the request, a long download among them.
  timeouts:
    request: 0s

# An Ingress, for a controller of your choice. Its annotations must let bodies of any size
# through unbuffered and leave long transfers alone (docs/reverse-proxy.md); ingress-nginx, whose
# annotations most examples show, is retired.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Empty: the host of config.server.externalURL.
  host: ""
  tls: []
  #  - secretName: lajstrom-tls
  #    hosts: [art.example.com]

# The metrics listener, server.metricsListen on 0.0.0.0, and the port metrics of the pods and
# the Service. No edge routes it.
metrics:
  enabled: true
  port: 9464
  # A ServiceMonitor of the Prometheus operator for the port metrics (docs/operations.md,
  # Metrics); needs its CRD. Each replica counts its own series.
  serviceMonitor:
    enabled: false
    # The labels your Prometheus selects ServiceMonitors by, e.g. release: kube-prometheus-stack.
    labels: {}
    interval: 30s
    scrapeTimeout: ""

# A HorizontalPodAutoscaler in place of replicaCount: every replica is the same, so CPU is a fair
# signal. Keep minReplicas at 2 or more for the PodDisruptionBudget to leave one serving.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

# Spread the replicas, e.g. over kubernetes.io/hostname. A constraint without a labelSelector
# gets the pods' own.
topologySpreadConstraints: []
affinity: {}
nodeSelector: {}
tolerations: []
priorityClassName: ""

# More variables, volumes and mounts for the container, as Kubernetes takes them: an upstream's
# credential file (upstreams[].auth.passwordFile), TMPDIR on a volume of its own.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# More objects released with the chart, as maps or as strings, each rendered with tpl: the
# policies of a Gateway implementation, a NetworkPolicy that admits only the edge, an
# ExternalSecret.
extraObjects: []
