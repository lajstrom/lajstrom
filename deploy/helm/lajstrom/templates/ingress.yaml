{{- if .Values.ingress.enabled }}
# The whole host to the port http, without a path prefix (docs/spec/http-routing.md §1). What the
# controller must do besides, it takes from ingress.annotations (docs/reverse-proxy.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lajstrom.fullname" . }}
  labels:
    {{- include "lajstrom.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | default (include "lajstrom.host" .) | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lajstrom.fullname" . }}
                port:
                  name: http
{{- end }}
