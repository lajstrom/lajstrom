{{- if and .Values.bootstrap.enabled .Values.bootstrap.generate }}
{{- if .Values.bootstrap.existingSecret }}
{{- fail "bootstrap.generate makes the Secret <full name>-bootstrap itself: leave bootstrap.existingSecret empty, or generate false for a Secret of your own" }}
{{- end }}
{{- $name := include "lajstrom.bootstrapSecretName" . }}
{{- $key := .Values.bootstrap.key }}
{{- $token := "" }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token = index (.data | default dict) $key | default "" }}
{{- end }}
# The one-time token of the first admin, made by the chart (#440): 64 random letters and digits,
# the same on every upgrade, since serve makes the token of the file valid at start only. Read it
# with the command of NOTES.txt; set bootstrap.enabled to false once the admin exists.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lajstrom.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | default (randAlphaNum 64 | b64enc) }}
{{- end }}
