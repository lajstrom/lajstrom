{{- if .Values.serviceAccount.create }}
# The identity of the replicas, for a cloud registry's workload identity (IRSA, EKS Pod Identity);
# no Role binds it, since Lajstrom never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lajstrom.serviceAccountName" . }}
  labels:
    {{- include "lajstrom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
