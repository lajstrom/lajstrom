{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs: name the Gateway (and its listener) the route attaches to" }}
{{- end }}
# The route of Lajstrom (docs/reverse-proxy.md, Gateway API): the whole host, without a path
# prefix or a rewrite, to the port http; OCI clients always ask /v2/ of the host. The port metrics
# is never routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lajstrom.fullname" . }}
  labels:
    {{- include "lajstrom.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml (.Values.httpRoute.hostnames | default (list (include "lajstrom.host" .))) | nindent 4 }}
  rules:
    # No matches: every path of the host.
    - backendRefs:
        - name: {{ include "lajstrom.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
