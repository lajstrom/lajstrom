# The reference scan job of #89 on GitLab CI: deploy/jobs/scan/scan.sh attaches a signed
# CycloneDX SBOM (syft) and a signed vulnerability report (trivy) to each version of a Lajstrom
# repo that has none (docs/guides/sbom-and-scans.md, A reference job). Include this file from the
# .gitlab-ci.yml of a project that holds scan.sh at the same path, run it from a pipeline
# schedule (CI/CD > Schedules, every night), and set the CI/CD variables:
#
#   LAJSTROM_URL     https://art.example.com
#   LAJSTROM_REPO    pypi/internal
#   LAJSTROM_TOKEN   masked: a deploy token of the repo with the scopes read and attach, made with
#                    lajstrom admin token create --repo pypi/internal --name scanner --scopes read,attach
#   COSIGN_KEY       of type File: the job's private key (cosign generate-key-pair), whose public
#                    key the server trusts (attachments.trust)
#   COSIGN_PASSWORD  masked: its password
#
# The job runs in alpine and installs the tools of pinned versions from their releases, checked
# against the checksums the releases publish. The token reads the versions and attaches to them;
# it cannot publish a version.

lajstrom-scan:
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    SYFT_VERSION: "1.33.0"
    TRIVY_VERSION: "0.67.2"
    COSIGN_VERSION: "3.1.4"
  cache:
    key: trivy-db
    paths: [.trivy-cache/]
  before_script:
    - apk add --no-cache bash curl jq
    - mkdir -p /tmp/tools && cd /tmp/tools
    - base=https://github.com/anchore/syft/releases/download/v$SYFT_VERSION
    - curl -fsSLO "$base/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -O "$base/syft_${SYFT_VERSION}_checksums.txt"
    - grep " syft_${SYFT_VERSION}_linux_amd64.tar.gz\$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
    - tar -xzf "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft
    - base=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION
    - curl -fsSLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -O "$base/trivy_${TRIVY_VERSION}_checksums.txt"
    - grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
    - tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
    - base=https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION
    - curl -fsSLO "$base/cosign-linux-amd64" -O "$base/cosign_checksums.txt"
    - grep " cosign-linux-amd64\$" cosign_checksums.txt | sha256sum -c -
    - install -m 0755 syft trivy /usr/local/bin/ && install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
    - cd "$CI_PROJECT_DIR"
  script:
    - TRIVY_CACHE_DIR="$CI_PROJECT_DIR/.trivy-cache" deploy/jobs/scan/scan.sh "$LAJSTROM_REPO"
