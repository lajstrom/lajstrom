# kubectl apply -k deploy/kubernetes (docs/deploy/kubernetes.md): the manifests of base/. They
# are in a directory of their own so that an overlay below this one, such as try/, can build on
# them: kustomize refuses a base that contains the overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
