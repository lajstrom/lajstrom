# Lajstrom, two replicas (docs/deploy/kubernetes.md). Every replica is the same: the state is in
# Postgres and in the registry, so any number of them serve behind one Service. Needs the
# ConfigMap lajstrom-config and the Secret lajstrom; the Secret lajstrom-bootstrap until the first
# admin exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lajstrom
  labels:
    app.kubernetes.io/name: lajstrom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lajstrom
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lajstrom
    spec:
      automountServiceAccountToken: false # Lajstrom never talks to the Kubernetes API
      # server.shutdownDelay (5s), then server.shutdownTimeout (30s) for in-flight requests, and
      # some: it must exceed the two.
      terminationGracePeriodSeconds: 40
      securityContext:
        # The nonroot user of the distroless image (65532); the image has no shell.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lajstrom
          image: ghcr.io/lajstrom/lajstrom:v0.1.0 # pin a digest: …:vX.Y.Z@sha256:…
          args: ["serve", "--config", "/etc/lajstrom/lajstrom.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          envFrom:
            # LAJSTROM_MASTER_KEY, LAJSTROM_DATABASE_DSN, LAJSTROM_REGISTRY_PASSWORD
            - secretRef:
                name: lajstrom
          # No preStop hook: the endpoint of a stopping pod goes while the pod gets SIGTERM, not
          # before, and serve keeps its listener open server.shutdownDelay (5s) after SIGTERM, so
          # that no request of a rollout finds it closed (docs/deploy/kubernetes.md, Upgrade).
          # serve applies the migrations and asks the registries (up to 20 s when one does not
          # answer) before it listens: give the start a minute (docs/deploy/kubernetes.md, Probes).
          startupProbe:
            httpGet: {path: /-/healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # Only "the process answers": an outage of the database or the registry must not
          # restart the pods (docs/operations.md, Readiness).
          livenessProbe:
            httpGet: {path: /-/healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 503 while the database does not answer or a registry has not answered for a minute.
          readinessProbe:
            httpGet: {path: /-/readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/lajstrom
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: bootstrap
              mountPath: /run/secrets/lajstrom-bootstrap
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lajstrom-config
        # Uploads and proxy fetches stream into the registry (ADR 0014) and take none of it. A /v2
        # chunk of a registry with uploads.spoolUnknownLength is spooled here for one request:
        # size it for the largest of those at once on one replica. Node disk, gone with the pod.
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        # The one-time token of the first admin, the file of auth.bootstrap.tokenFile. Optional:
        # deleted once the admin exists, and its file leaves the pods (docs/deploy/kubernetes.md).
        - name: bootstrap
          secret:
            secretName: lajstrom-bootstrap
            optional: true
