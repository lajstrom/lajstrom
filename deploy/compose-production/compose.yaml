# A production-shaped Lajstrom on one host (docs/deploy/compose.md): Lajstrom, Postgres as the
# index database, distribution as the registry that holds every byte. Not the dev stack
# (deploy/compose, docs/dev-stack.md): every service has a password, nothing but Lajstrom is
# published, and Lajstrom listens on loopback for the TLS edge in front of it.
#
#   docs/deploy/compose.md        make the secrets, start, make the first admin, back up
#
# Only Postgres and the registry keep data, each in a named volume. Lajstrom keeps nothing: its
# root filesystem is read-only and /tmp, where an upload is spooled for one request, is a tmpfs.
#
# The secrets are files in ./secrets (git-ignored), made once with the commands of the doc:
#   secrets/master-key            the master key, owned by the image's user 65532, mode 0600
#   secrets/bootstrap-token       the one-time token of the first admin, owned likewise
#   secrets/lajstrom.env          LAJSTROM_DATABASE_DSN, LAJSTROM_REGISTRY_PASSWORD
#   secrets/postgres-password     the password of the Postgres user lajstrom
#   secrets/registry.htpasswd     the bcrypt htpasswd line of the registry user lajstrom
#
# A registry you already run (Zot, Harbor, ECR, GitLab): delete the registry service, its
# volume, its secret and the registry entry of depends_on below, and point registries[0] of
# lajstrom.yaml at it (docs/registries/).

name: lajstrom

services:
  lajstrom:
    # Pin a release by digest: ghcr.io/lajstrom/lajstrom:vX.Y.Z@sha256:… (docs/install.md).
    image: ${LAJSTROM_IMAGE:-ghcr.io/lajstrom/lajstrom:v0.1.0}
    command: ["serve", "--config", "/etc/lajstrom/lajstrom.yaml"]
    # The database DSN and the registry password, which Lajstrom reads from the environment.
    env_file: ./secrets/lajstrom.env
    # The master key as the file /run/secrets/lajstrom-master-key (keys.masterKeyFile). Compose
    # bind-mounts a file secret with the owner and mode of the host's file and ignores uid, gid
    # and mode, so the file itself must be readable by the image's user 65532.
    # The one-time token of the first admin as the file /run/secrets/lajstrom-bootstrap-token
    # (auth.bootstrap.tokenFile), owned and readable like the master key. Remove both entries of
    # lajstrom-bootstrap-token once the admin exists (docs/deploy/compose.md, 4).
    secrets: [lajstrom-master-key, lajstrom-bootstrap-token]
    volumes:
      - ./lajstrom.yaml:/etc/lajstrom/lajstrom.yaml:ro
    read_only: true
    tmpfs:
      # Uploads are spooled here for the length of one request: size it for the largest
      # concurrent uploads. tmpfs is memory; a large-upload host mounts a disk directory instead.
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # The TLS edge on this host proxies to it; never publish it on every interface.
      - "127.0.0.1:${LAJSTROM_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      # The image has no shell and no HTTP client: the binary asks its own /-/readyz, which is
      # 503 while the database or the registry does not answer (lajstrom healthcheck).
      test: ["CMD", "/lajstrom", "healthcheck", "--url", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 40s # server.shutdownTimeout (30s) and some

  postgres:
    # The Postgres of the dev stack and of CI, the one Lajstrom is tested against (17.11).
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: lajstrom
      POSTGRES_DB: lajstrom
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lajstrom", "-d", "lajstrom"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  registry:
    # distribution 3.1.2 on its filesystem storage, Basic auth with one user (docs/registries/distribution.md).
    image: registry:3.1.2
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: lajstrom
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry-htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_LOG_LEVEL: info
    secrets: [registry-htpasswd]
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      # /v2/ is 401 without credentials; the root answers 200 without them.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

secrets:
  lajstrom-bootstrap-token:
    file: ./secrets/bootstrap-token
  lajstrom-master-key:
    file: ./secrets/master-key
  postgres-password:
    file: ./secrets/postgres-password
  registry-htpasswd:
    file: ./secrets/registry.htpasswd

volumes:
  postgres-data:
  registry-data:
