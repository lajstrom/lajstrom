# Lajstrom of deploy/compose-production/compose.yaml (docs/deploy/compose.md). Every key is in
# docs/configuration.md; what is not here has its default. No secret is in this file: the
# master key is the Compose secret lajstrom-master-key, and the database DSN with its password
# and the registry password come from secrets/lajstrom.env.

server:
  listen: ":8080"
  # The public URL that clients use, the TLS edge's (docs/configuration.md, server.externalURL):
  # the realm of the bearer challenge of /v2 is <externalURL>/v2/token.
  externalURL: "https://art.example.com"
  # The peers whose X-Forwarded-For names the client: the address the edge's connections come
  # from, as Lajstrom sees them (docs/configuration.md, server.trustedProxies). While it is
  # empty, Lajstrom takes the edge for the client: the per-address throttles of failed logins
  # and /v2/token are off, and the logs record the edge's address. It is not 127.0.0.1: Docker
  # passes a connection to the published port on from an address of its own, usually the
  # gateway of the compose network. Send one request through the edge, read the remoteAddr of
  # its line in docker compose logs lajstrom, and list that address (docs/deploy/compose.md, 2).
  # trustedProxies: ["<the edge's address, as the access log shows it>"]
  # Prometheus scrapes it inside the compose network; the port is not published.
  metricsListen: "0.0.0.0:9464"

log:
  format: json

database:
  driver: postgres
  # dsn: from LAJSTROM_DATABASE_DSN in secrets/lajstrom.env: it carries the password.

registries:
  - name: local
    url: "http://registry:5000"
    # Every OCI repository Lajstrom creates is under lajstrom/ in the registry.
    prefix: "lajstrom/"
    auth:
      username: lajstrom
      passwordEnv: LAJSTROM_REGISTRY_PASSWORD

auth:
  # No admin password here or in secrets/: the one-time token of secrets/bootstrap-token, the
  # Compose secret lajstrom-bootstrap-token, makes the first admin with lajstrom admin bootstrap
  # (docs/deploy/compose.md, 4). Remove this once the admin exists.
  bootstrap:
    tokenFile: /run/secrets/lajstrom-bootstrap-token

keys:
  # The Compose secret lajstrom-master-key of compose.yaml.
  masterKeyFile: /run/secrets/lajstrom-master-key

# Created at the first start when the database does not have them; the API and
# lajstrom admin repo create more. Listing them here also brings them back after the
# database is lost without a backup (docs/operations.md, Disaster recovery).
repos:
  - name: assets
    format: raw
    registry: local
