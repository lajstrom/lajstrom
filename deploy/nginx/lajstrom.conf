# nginx in front of Lajstrom (docs/reverse-proxy.md): TLS, the whole host, bodies streamed both
# ways, and a request limit on the token endpoint only. A file for the http {} context, as
# /etc/nginx/conf.d/lajstrom.conf of the nginx image. Tried with nginx 1.30.6; replace
# art.example.com, the certificate paths and the upstream address.

upstream lajstrom {
    # Every replica, one line each; Lajstrom keeps no session in a replica. Open-source nginx has
    # no active check of /-/readyz: a replica that refuses a connection is left out for
    # fail_timeout, which must be shorter than server.shutdownDelay (5s) by more than a second,
    # so that a rolling restart always leaves one in (docs/reverse-proxy.md, Restarts).
    server lajstrom:8080 max_fails=1 fail_timeout=3s;
    keepalive 32;                  # HTTP/1.1 connections kept open to the upstream
    keepalive_timeout 60s;         # idle ones closed before Lajstrom closes them (120 s)
}

# Part 2, limits. Per client address, as nginx sees it: put real_ip in front of this when
# another balancer is in front of nginx (docs/reverse-proxy.md, "The client address").
limit_req_zone  $binary_remote_addr zone=lajstrom_token:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=lajstrom_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 443 ssl;
    http2 on;
    server_name art.example.com;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # Uploads: no size limit (the default is 1m, and a layer is gigabytes), streamed to Lajstrom
    # as they arrive instead of spooled to nginx's disk first.
    client_max_body_size    0;
    proxy_request_buffering off;
    # Downloads: streamed to the client, not spooled to nginx's disk (a blob is gigabytes).
    proxy_buffering         off;

    # Lajstrom bounds no whole transfer, only a body that stops moving (server.stallTimeout);
    # nginx's timeouts apply between two reads or writes too, a stalled transfer, not a long one.
    proxy_connect_timeout   10s;
    proxy_send_timeout      600s;
    proxy_read_timeout      600s;
    client_body_timeout     600s;
    send_timeout            600s;

    # A request that finds its replica gone, the connection refused or closed before an answer,
    # goes to the next one, once. nginx resends a GET, HEAD, PUT or DELETE, and a POST or PATCH
    # it has not sent yet; never a POST or PATCH it sent (no non_idempotent), nor a body it has
    # begun to stream. Not http_502: Lajstrom answers 502 for a registry that refuses it, the same
    # on every replica, and nginx would count it as the replica's failure.
    proxy_next_upstream       error timeout;
    proxy_next_upstream_tries 2;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Location (the uploads' sessions, the blobs' 307 to the storage) and WWW-Authenticate
    # pass as Lajstrom wrote them.
    proxy_redirect off;

    location / {
        proxy_pass http://lajstrom;

        # Part 2, optional: concurrent connections and bandwidth per client address. Off here,
        # see docs/reverse-proxy.md before turning them on: a CI farm behind NAT is one address.
        # With these values test/e2e/ha.sh passes through the dev stack's ha profile.
        # limit_conn lajstrom_conn 64;
        # limit_rate_after 100m;
        # limit_rate 50m;
    }

    # The token endpoint: a docker or oras login, and every pull or push that starts, asks it
    # once or a few times; 20 a second with a burst of 40 from one address is far above that.
    location = /v2/token {
        limit_req zone=lajstrom_token burst=40 nodelay;
        proxy_pass http://lajstrom;
    }

    # 429 with Retry-After, in the error format of /v2, for what the limits above refuse.
    error_page 429 @lajstrom_429;
    location @lajstrom_429 {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"errors":[{"code":"TOOMANYREQUESTS","message":"too many requests"}]}\n';
    }
}
