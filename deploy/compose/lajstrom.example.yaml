# Lajstrom configuration for local development: SQLite, and the two registries of the dev stack
# (make dev-up, docs/dev-stack.md). Every key is listed; docs/configuration.md describes them.
# Environment variables LAJSTROM_SERVER_LISTEN, LAJSTROM_SERVER_EXTERNAL_URL, LAJSTROM_LOG_LEVEL,
# LAJSTROM_LOG_FORMAT, LAJSTROM_DATABASE_DRIVER and LAJSTROM_DATABASE_DSN override the scalar keys
# of the same name. Secrets never go into this file: name the environment variable that holds
# them (*Env keys).
#
# The index stays SQLite so that make run works without Docker. The Postgres of the dev stack is
# one line away:
#
#   LAJSTROM_DATABASE_DRIVER=postgres LAJSTROM_DATABASE_DSN='postgres://lajstrom:lajstrom@localhost:5432/lajstrom?sslmode=disable' make run
#
# make run prefers deploy/compose/lajstrom.yaml, your edited copy of this file (not committed).

server:
  listen: ":8080"                     # host:port to listen on
  externalURL: "http://localhost:8080" # base of every absolute URL Lajstrom renders
  shutdownTimeout: 30s                # how long in-flight requests get on SIGTERM

log:
  level: info                         # debug | info | warn | error
  format: text                        # text | json

database:
  driver: sqlite                      # sqlite | postgres
  dsn: "file:lajstrom.db"             # SQLite file, or postgres://user@host/db?sslmode=disable

registries:
  - name: local                       # referred to by repos[].registry
    type: generic                     # generic (distribution, Zot, Harbor, GHCR) | ecr
    url: "http://localhost:5000"      # Zot from the dev stack (make dev-up)
    prefix: ""                        # instance prefix of every OCI repository, e.g. "art/"; empty for none
    auth:
      username: ""                    # empty: the dev Zot allows anonymous push and pull
      passwordEnv: ""                 # name of the environment variable that holds the password
    timeout: 30s                      # one request up to its response headers; a blob streams as long as it takes
    retries: 3                        # retries of a failed request (429, 5xx, timeouts); negative: none
    capabilities: {}                  # override what probing finds, e.g. {catalog: false, deleteManifest: false}
  - name: second                      # distribution from the dev stack, for repos created with --registry second
    type: generic
    url: "http://localhost:5001"      # no referrers API: Lajstrom lists referrers through the sha256-<digest> tag schema
    prefix: ""
    auth:
      username: ""                    # empty: the dev distribution allows anonymous push and pull
      passwordEnv: ""
    timeout: 30s
    retries: 3
    capabilities: {}

ingest:
  claimTTL: 10m                       # a publish's claim on a tag older than this is stale and taken over

auth:
  anonymousRead: false                # server-wide switch for anonymous read (RBAC, issue #45)
  tokenSigningKeyFile: ""             # PEM key that signs OCI bearer tokens (issue #26)

keys:
  masterKeyEnv: LAJSTROM_MASTER_KEY   # environment variable with the key that encrypts signing keys (issue #41)

repos:                                # created at startup when missing (issue #14)
  - name: scratch                     # repo name, unique within its format
    format: raw                       # raw | pypi | apt | maven
    registry: local                   # one of registries[].name
    anonymousRead: false              # readable without credentials when auth.anonymousRead allows it
