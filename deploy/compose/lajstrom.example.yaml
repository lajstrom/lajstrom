# Lajstrom configuration for local development: SQLite, and the two registries of the dev stack
# (make dev-up, docs/dev-stack.md). Every key is listed; docs/configuration.md describes them.
# Environment variables LAJSTROM_SERVER_LISTEN, LAJSTROM_SERVER_EXTERNAL_URL,
# LAJSTROM_SERVER_METRICS_LISTEN, LAJSTROM_LOG_LEVEL, LAJSTROM_LOG_FORMAT, LAJSTROM_DATABASE_DRIVER
# and LAJSTROM_DATABASE_DSN override the scalar keys of the same name, LAJSTROM_MASTER_KEY_FILE
# overrides keys.masterKeyFile. Secrets never go into this file: name the environment variable
# that holds them (*Env keys).
#
# The index stays SQLite so that make run works without Docker. The Postgres of the dev stack is
# one line away:
#
#   LAJSTROM_DATABASE_DRIVER=postgres LAJSTROM_DATABASE_DSN='postgres://lajstrom:lajstrom@localhost:5432/lajstrom?sslmode=disable' make run
#
# make run prefers deploy/compose/lajstrom.yaml, your edited copy of this file (not committed).

server:
  listen: "127.0.0.1:8080"            # host:port to listen on; loopback only, as the HTTP is plain; ":8080" is every interface
  externalURL: "http://localhost:8080" # base of every absolute URL Lajstrom renders; https://<host> outside the dev stack
  insecureHTTP: true                  # allows the http externalURL above, on loopback only; never in production
  tls:                                # TLS in Lajstrom itself, for a single host; empty: TLS at the edge
    certFile: ""                      # PEM certificate chain
    keyFile: ""                       # PEM private key
  shutdownTimeout: 30s                # how long in-flight requests get on SIGTERM
  shutdownDelay: 5s                   # before that, still serving while the edge stops sending; /-/readyz 503
  maxManifestSize: 4194304            # bytes; the largest manifest a PUT to /v2 may carry
  maxCreatedAhead: 5m                 # how far a /v2 push's org.opencontainers.image.created may be after the clock
  maxCreatedBehind: 1h                # and before it: oras writes it before it uploads the files
  metricsListen: "127.0.0.1:9464"     # GET /metrics for Prometheus; never the public host; empty: off
  pprof: false                        # /debug/pprof/ on the metrics listener
  stallTimeout: 1m                    # a body that moves no byte for this long is cut off; 0s: off
  maxConcurrentUploads: 0             # uploads at once per replica, the next one is 503; 0: no limit
  uploadSessions:                     # live /v2 upload sessions of one principal on a replica; 0: no bound
    perRepo: 256                      # in one repo; a new session beyond is 429 TOOMANYREQUESTS
    perPrincipal: 1024                # in all repos
  trustedProxies: []                 # CIDRs of the edge whose X-Forwarded-For is believed; empty: the peer is the client

log:
  level: info                         # debug | info | warn | error
  format: text                        # text | json

database:
  driver: sqlite                      # sqlite | postgres
  dsn: "file:lajstrom.db"             # SQLite file, or postgres://user@host/db?sslmode=disable

registries:
  - name: local                       # referred to by repos[].registry
    type: generic                     # generic (distribution, Zot, Harbor, GHCR) | ecr
    url: "http://localhost:5000"      # Zot from the dev stack (make dev-up)
    prefix: ""                        # instance prefix of every OCI repository, e.g. "art/"; empty for none
    auth:
      username: ""                    # empty: the dev Zot allows anonymous push and pull
      passwordEnv: ""                 # name of the environment variable that holds the password
    tokenRealmHosts: []               # other hosts its bearer token realm may be on (https only), e.g. [gitlab.example.com]
    timeout: 30s                      # one request up to its response headers; a blob streams as long as it takes
    retries: 3                        # retries of a failed request (429, 5xx, timeouts); negative: none
    capabilities: {}                  # override what probing finds, e.g. {catalog: false, deleteManifest: false}
    uploads:
      spoolUnknownLength: false       # Gitea, Forgejo, JFrog: spool a /v2 chunk of unknown length after the first to $TMPDIR
      chunkSize: 0                    # bytes of each PATCH of an upload Lajstrom streams; 0: 4 MiB on GHCR, else 8 MiB
    # ecr: {region: "", endpoint: ""} # type ecr only: region, endpoint, imageTagMutability, encryption, … (docs/registries/ecr.md)
  - name: second                      # distribution from the dev stack, for repos created with --registry second
    type: generic
    url: "http://localhost:5001"      # no referrers API: Lajstrom lists referrers through the sha256-<digest> tag schema
    prefix: ""
    auth:
      username: ""                    # empty: the dev distribution allows anonymous push and pull
      passwordEnv: ""
    timeout: 30s
    retries: 3
    capabilities: {}

upstreams: []                         # registries that proxy repos serve (ADR 0013), with a format whose plugin has proxy repos:
#  - name: npmjs                      # referred to by repos[].upstream.name
#    format: npm
#    url: "https://registry.npmjs.org/"
#    auth: {tokenFile: ""}            # or {username: …, passwordFile: …}; files read at start
#    timeout: 30s                     # up to the response headers, and every wait for the next bytes of a body
#    retries: 2
#    maxMetadataSize: 67108864        # the largest document of one name that is cached

ingest:
  claimTTL: 10m                       # a publish's claim on a tag older than this is stale and taken over
  visibilityTimeout: 30s              # how long a publish reads back what it pushed until the registry serves it; then 503

reconcile:
  interval: 1h                        # a reindex of every repo with prune this often; 0 turns it off
  graceAge: 1h                        # prune never removes a version published or seen in the registry less than this ago

auth:
  anonymousRead: false                # server-wide switch for anonymous read (RBAC, issue #45)
  # bootstrap:                        # the one-time token of the first admin (docs/auth.md)
  #   tokenFile: /run/secrets/bootstrap-token   # a token you made: openssl rand -hex 32
  #   ttl: 24h

keys:
  masterKeyEnv: LAJSTROM_MASTER_KEY   # environment variable with the key that encrypts the apt keys and the bearer-token key; unset: apt repos are unsigned, tokens use an ephemeral key
  masterKeyFile: ""                   # or a file with that key (a mounted secret), env LAJSTROM_MASTER_KEY_FILE; not both
  algorithm: ed25519                  # ed25519 | rsa4096 (apt before 2.0); for keys made from now on
  retireGrace: 720h                   # a key retired by a rotation still signs and stays in key.asc this long
  tokenAlgorithm: ES256               # ES256 | EdDSA; for bearer-token keys made from now on (the key lives in the database, ADR 0010)

repos:                                # created at startup when missing (issue #14)
  - name: scratch                     # repo name, unique within its format
    format: raw                       # raw | pypi | apt | maven | npm | oci
    registry: local                   # one of registries[].name
    kind: hosted                      # hosted | proxy | group; a proxy and a group need npm
    anonymousRead: false              # readable without credentials when auth.anonymousRead allows it
    # policy: {maxFileSize: 104857600}  # the repo's policy, as the management API takes it (docs/api.md)
    # upstream: {name: npmjs}         # a proxy's upstream, one of upstreams[].name
    # group: {members: [npm-hosted, npm-proxy]}  # a group's members, in the order they are read
