# The Verdaccio of the verdaccio profile (deploy/compose/compose.yaml): the registry that packages
# move from in test/e2e/migrate-npm.sh (#441, docs/migrating.md). For development only: anyone
# who reaches the port may register a user, and every package needs one to be read or
# published, as in a company's private registry. It has no uplink: it serves what was published
# to it and nothing of npmjs.org.
storage: /verdaccio/storage/data
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 1000
packages:
  "@*/*":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated
  "**":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated
server:
  keepAliveTimeout: 60
max_body_size: 100mb
listen: 0.0.0.0:4873
log: {type: stdout, format: pretty, level: warn}
