# Lajstrom dev stack (issue #15, docs/dev-stack.md): the registries and the database that
# make run, make test-integration and the e2e scripts work against. For development only: both
# registries take anonymous pushes and the Postgres password is "lajstrom".
#
#   make dev-up            start, and wait until all three services are healthy
#   make dev-up PROFILES=s3  the same, and distribution on SeaweedFS (the s3 profile, #27, #118)
#   make dev-up PROFILES=s3-minio  the same, and distribution on MinIO, the fallback of the s3 profile
#   make dev-up PROFILES=gitlab  the same, and the GitLab container registry, two variants (the gitlab profile, #117)
#   make dev-ps            what runs, with its health
#   make dev-logs          follow the logs
#   make dev-down          stop and remove the containers of every profile; the volumes stay
#   make dev-down RESET=1  the same, and remove the volumes: the next dev-up starts empty
#
# Published on 127.0.0.1 only. The host ports can be changed in deploy/compose/.env
# (copy .env.example):
#
#   zot              localhost:5000  LAJSTROM_ZOT_PORT              registry "local" of lajstrom.example.yaml
#   distribution     localhost:5001  LAJSTROM_DISTRIBUTION_PORT     registry "second"
#   postgres         localhost:5432  LAJSTROM_PG_PORT               postgres://lajstrom:lajstrom@localhost:5432/lajstrom?sslmode=disable
#   distribution-s3  localhost:5002  LAJSTROM_DISTRIBUTION_S3_PORT  s3 profile: blob GETs answer 307 to SeaweedFS
#   seaweedfs        localhost:9000  LAJSTROM_S3_PORT               s3 profile: the S3 gateway, which the presigned URLs name
#   distribution-s3-minio  localhost:5006  LAJSTROM_DISTRIBUTION_S3_MINIO_PORT  s3-minio profile: blob GETs answer 307 to MinIO
#   minio            localhost:9001  LAJSTROM_MINIO_PORT            s3-minio profile: the presigned URLs name it
#   gitlab           localhost:5003  LAJSTROM_GITLAB_PORT           gitlab profile: variant A, metadata on the filesystem
#   gitlab-db        localhost:5004  LAJSTROM_GITLAB_DB_PORT        gitlab profile: variant B, the metadata database (docs/registries/gitlab.md)
#
# Every image is pinned to a full version whose tag serves linux/amd64 and linux/arm64; the
# digest of its image index is in the comment above it. Change a tag and its digest together;
# for a registry, re-run the integration tests and update docs/registries/README.md. The
# integration job of .github/workflows/ci.yml runs the same images: change them there too. It
# does not run the s3, s3-minio and gitlab profiles.

name: lajstrom-dev

# Checks run every second until a container is healthy, then every 30 s; each check is a line
# in the logs of the registries.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 1s

services:
  zot:
    # Zot v2.1.23, the minimal build (no extensions), the version docs/registries/README.md lists.
    # sha256:59cb5740832970818903c5ce104425762664c7880835ee566506aad397cd3458
    image: ghcr.io/project-zot/zot-minimal:v2.1.23
    volumes:
      - ./zot/config.json:/etc/zot/config.json:ro
      - zot-data:/var/lib/registry
    ports:
      - "127.0.0.1:${LAJSTROM_ZOT_PORT:-5000}:5000"
    healthcheck:
      <<: *healthcheck
      # zot healthcheck probes /readyz at the address of the config. The image has no shell and
      # names the binary after the architecture (zot-linux-<arch>-minimal); /proc/1/exe is that
      # binary on both, since it runs as PID 1.
      test: ["CMD", "/proc/1/exe", "healthcheck", "/etc/zot/config.json"]

  distribution:
    # distribution 3.1.2, which registry:3 pointed at on 2026-11-07.
    # sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
    image: registry:3.1.2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true" # the image's default too; distribution's own is false
      REGISTRY_LOG_LEVEL: info                # the image's default is debug
    volumes:
      - distribution-data:/var/lib/registry   # filesystem storage, the root of the image's configuration
    ports:
      - "127.0.0.1:${LAJSTROM_DISTRIBUTION_PORT:-5001}:5000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]

  # The s3 profile (make dev-up PROFILES=s3): distribution on SeaweedFS, the backend that answers
  # a blob GET with a 307 to a presigned URL (#27, #118). distribution-s3 runs in the network
  # namespace of seaweedfs, so that both reach the S3 gateway as localhost:<port>: distribution
  # signs its redirects for the endpoint it talks to, and the same URL then works from the host,
  # where seaweedfs publishes that port. Its own port is published on the seaweedfs service for
  # the same reason.
  seaweedfs:
    profiles: [s3]
    # SeaweedFS 4.52 (Apache-2.0) on Alpine, linux/amd64, linux/arm64 and four more. weed server
    # -s3 runs the master, a volume server, the filer and the S3 gateway in one process; the
    # image's entrypoint adds -dir=/data and volumes of 1024 MB at most, as many as the disk holds.
    # sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    image: chrislusf/seaweedfs:4.52
    command:
      - server
      - -ip=127.0.0.1                     # the address the parts give each other, the same on every start
      - -ip.bind=0.0.0.0                  # the default binds -ip only, which a published port does not reach
      - -s3
      - -s3.port=${LAJSTROM_S3_PORT:-9000}
      - -s3.config=/etc/seaweedfs/s3.json # the identity lajstrom, secret key lajstrom-dev
      - -s3.iam=false                     # the IAM API, unused; on, it logs an error for want of an STS key
      - -master.peers=none                # one master: on a restart it is the leader at once, not after an election
      - -volume.preStopSeconds=1          # the default, 10, is Docker's stop timeout: every stop ended in a kill
      - -master.telemetry=false           # on by default: usage statistics to telemetry.seaweedfs.com
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${LAJSTROM_S3_PORT:-9000}:${LAJSTROM_S3_PORT:-9000}"
      - "127.0.0.1:${LAJSTROM_DISTRIBUTION_S3_PORT:-5002}:5000" # distribution-s3
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:${LAJSTROM_S3_PORT:-9000}/healthz"]

  seaweedfs-bucket:
    profiles: [s3]
    # The bucket of distribution-s3, made once the gateway is healthy, and exits. weed shell
    # finds the master on localhost:9333; s3.bucket.create fails when the bucket exists, so it
    # runs only when s3.bucket.list does not name it, as the bucket hook of SeaweedFS's Helm
    # chart does.
    image: chrislusf/seaweedfs:4.52
    network_mode: service:seaweedfs
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo s3.bucket.list | weed shell | awk '$$1 == "distribution" { found = 1 } END { exit !found }'
        || echo s3.bucket.create -name distribution | weed shell
    tmpfs: /data # the image declares a volume on /data; without a mount there, each run leaves one behind

  distribution-s3:
    profiles: [s3]
    # The same distribution as above, on the s3 storage driver.
    image: registry:3.1.2
    network_mode: service:seaweedfs
    depends_on:
      seaweedfs-bucket:
        condition: service_completed_successfully
    environment: &distribution-s3-environment
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_REGION: us-east-1
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://localhost:${LAJSTROM_S3_PORT:-9000}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_BUCKET: distribution
      REGISTRY_STORAGE_S3_ACCESSKEY: lajstrom
      REGISTRY_STORAGE_S3_SECRETKEY: lajstrom-dev
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_LOG_LEVEL: info
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]

  # The s3-minio profile (make dev-up PROFILES=s3-minio): the same distribution on MinIO, the
  # fallback of the s3 profile (#27, #118), with the same trick: distribution-s3-minio runs in the
  # network namespace of minio and reaches it as localhost:<port>, which minio publishes, as it
  # publishes the port of distribution-s3-minio. Ports of its own, so that both profiles can run
  # at once.
  minio:
    profiles: [s3-minio]
    # MinIO 2025-07-23, packaged by Bitnami: minio/minio is no longer on Docker Hub. The image
    # creates the bucket of MINIO_DEFAULT_BUCKETS on its first start.
    # sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: lajstrom
      MINIO_ROOT_PASSWORD: lajstrom-dev
      MINIO_DEFAULT_BUCKETS: distribution
      MINIO_API_PORT_NUMBER: ${LAJSTROM_MINIO_PORT:-9001} # the image passes --console-address :9001 too; this release has no console
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:${LAJSTROM_MINIO_PORT:-9001}:${LAJSTROM_MINIO_PORT:-9001}"
      - "127.0.0.1:${LAJSTROM_DISTRIBUTION_S3_MINIO_PORT:-5006}:5000" # distribution-s3-minio
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${LAJSTROM_MINIO_PORT:-9001}/minio/health/live"]

  distribution-s3-minio:
    profiles: [s3-minio]
    # distribution-s3, but for the endpoint.
    image: registry:3.1.2
    network_mode: service:minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *distribution-s3-environment
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://localhost:${LAJSTROM_MINIO_PORT:-9001}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]

  # The gitlab profile (make dev-up PROFILES=gitlab): the GitLab container registry, the fork of
  # distribution that GitLab.com runs, in its two variants, to test Lajstrom against (#117,
  # docs/registries/gitlab.md). The image is the registry as GitLab's cloud-native chart ships
  # it; it runs as git (uid 1000). Its tag is rebuilt in place (the v4.43.0-gitlab below was
  # built on 2026-11-07): the digest is that of the image index on the day of the test. No
  # authentication: anyone on the machine can push, pull and delete.
  gitlab:
    profiles: [gitlab]
    # GitLab container registry v4.43.0, linux/amd64 and linux/arm64; variant A, metadata on
    # the filesystem.
    # sha256:fe9c67416a605ffaa5a053c17a6d3b1eab0668a33a58b7bd938a476088f8222e
    image: registry.gitlab.com/gitlab-org/build/cng/gitlab-container-registry:v4.43.0-gitlab
    volumes:
      # The image reads /etc/docker/registry/config.yml. It has no /var/lib/registry, and a
      # named volume on a path the image lacks is created owned by root, which git cannot write;
      # on the home of git, Docker gives the new volume that directory's owner.
      - ./gitlab/config.yml:/etc/docker/registry/config.yml:ro
      - gitlab-data:/home/git
    ports:
      - "127.0.0.1:${LAJSTROM_GITLAB_PORT:-5003}:5000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/v2/"]

  gitlab-db:
    profiles: [gitlab]
    # The same image; variant B, the metadata database: the schema migrations first (the
    # image's /scripts/db-migrate: registry database migrate up), then the registry.
    image: registry.gitlab.com/gitlab-org/build/cng/gitlab-container-registry:v4.43.0-gitlab
    command: ["/bin/bash", "-c", "/scripts/db-migrate && exec /scripts/process-wrapper"]
    environment:
      # With the database the registry refuses a manifest whose artifactType or config media
      # type is not in its table of known media types: every manifest of Lajstrom's profile
      # (application/vnd.lajstrom.<format>.v1). true adds unknown types on push instead; false
      # is the registry's default (docs/registries/gitlab.md, "Media types").
      REGISTRY_FF_DYNAMIC_MEDIA_TYPES: ${LAJSTROM_GITLAB_DYNAMIC_MEDIA_TYPES:-false}
      # How long after an event the online garbage collector reviews a manifest or a blob
      # (gc.reviewafter); -1 reviews at once (docs/registries/gitlab.md, "Garbage collection").
      REGISTRY_GC_REVIEWAFTER: ${LAJSTROM_GITLAB_GC_REVIEWAFTER:-24h}
    depends_on:
      gitlab-postgres:
        condition: service_healthy
    volumes:
      - ./gitlab/config-db.yml:/etc/docker/registry/config.yml:ro
      - gitlab-db-data:/home/git
    ports:
      - "127.0.0.1:${LAJSTROM_GITLAB_DB_PORT:-5004}:5000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/v2/"]

  gitlab-postgres:
    profiles: [gitlab]
    # The image of the stack's postgres (the registry needs 16 or later), with a database, user
    # and password of its own: registry. Not published.
    # sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    volumes:
      - gitlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U registry -d registry"]

  postgres:
    # PostgreSQL 17.11 on Alpine.
    # sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${LAJSTROM_PG_DB:-lajstrom}
      POSTGRES_USER: ${LAJSTROM_PG_USER:-lajstrom}
      POSTGRES_PASSWORD: ${LAJSTROM_PG_PASSWORD:-lajstrom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LAJSTROM_PG_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck
      # Over TCP: on the first start the entrypoint runs initdb with a server that listens on
      # the socket only, and restarts it; the socket would answer before the database is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

volumes:
  zot-data:
  distribution-data:
  postgres-data:
  seaweedfs-data:
  minio-data:
  gitlab-data:
  gitlab-db-data:
  gitlab-postgres-data:
