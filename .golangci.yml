# golangci-lint v2 configuration. Keep it small; add linters deliberately, with a reason.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # every HTTP response body is closed; the facade and the providers are HTTP clients
    - depguard      # the package boundaries of CLAUDE.md as code (rules below)
    - errorlint     # errors.Is/As and %w, so the sentinel errors of each package keep working
    - exhaustive    # switch over auth.Kind, auth.Action and the like names every value
    - forbidigo     # slog only: no fmt.Print* and no std log outside cmd/
    - gocyclo       # cyclomatic complexity: a function above 15 is split, not annotated
    - gosec
    - importas      # one alias for the OCI image-spec package
    - misspell
    - noctx         # context.Context on every I/O call: HTTP requests, dialing, listening
    - nolintlint    # a //nolint names the linter and says why
    - revive
    - rowserrcheck  # rows.Err() is checked (internal/index)
    - sqlclosecheck # rows and statements are closed (internal/index)
  settings:
    depguard:
      rules:
        registry-client:
          # Only internal/provider talks to the backend registry (CLAUDE.md, invariants).
          list-mode: lax
          files:
            - "!**/internal/provider/**"
            - "!**/internal/testutil/**"
            - "!**/*_test.go"
          deny:
            - pkg: oras.land/oras-go/v2/registry/remote
              desc: only internal/provider talks to the registry (CLAUDE.md invariants)
        one-write-path:
          # Plugins publish only through format.Deps.Ingest (CLAUDE.md, invariants): no oras-go,
          # whose Copy, PushBytes and Tag would write to a provider.Repository; forbidigo below
          # stops the writing methods of the provider itself.
          list-mode: lax
          files:
            - "**/internal/format/**"
            - "!**/*_test.go"
          deny:
            - pkg: oras.land/oras-go/v2
              desc: one write path, plugins publish through format.Deps.Ingest (CLAUDE.md invariants)
        database:
          # Only internal/index talks to the database (CLAUDE.md, invariants).
          list-mode: lax
          files:
            - "!**/internal/index/**"
          deny:
            - pkg: database/sql
              desc: only internal/index talks to the database (CLAUDE.md invariants)
            - pkg: modernc.org/sqlite
              desc: only internal/index talks to the database (CLAUDE.md invariants)
            - pkg: github.com/jackc/pgx
              desc: only internal/index talks to the database (CLAUDE.md invariants)
        not-approved:
          # docs/spec/layout.md §3: no web framework, no ORM.
          list-mode: lax
          deny:
            - pkg: github.com/go-chi/chi
              desc: no web framework (docs/spec/layout.md §3)
            - pkg: github.com/gin-gonic/gin
              desc: no web framework (docs/spec/layout.md §3)
            - pkg: github.com/labstack/echo
              desc: no web framework (docs/spec/layout.md §3)
            - pkg: github.com/gorilla/mux
              desc: no web framework (docs/spec/layout.md §3)
            - pkg: gorm.io
              desc: no ORM (docs/spec/layout.md §3)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog, or cmd.OutOrStdout() in cmd/lajstrom
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use log/slog
        # The writing methods of the provider, which format.Deps.Providers hands the plugins for
        # reads. Only internal/format is held to it (exclusions below): ingest and the facade
        # write through the provider. A streamed upload's BlobWriter is ingest's too (ADR 0014).
        - pattern: ^provider\.(Provider\.(EnsureRepository|DeleteRepository)|(Repository|BlobUploader)\.(Push|PushReference|Tag|Delete|StartBlobUpload|MountBlob|AppendBlobChunk|FinishBlobUpload|CancelBlobUpload)|(Repository|BlobStreamer)\.OpenBlobWriter|BlobWriter\.(Write|Commit|Cancel)|NewChunkedWriter)$
          pkg: ^github\.com/lajstrom/lajstrom/internal/provider$
          msg: one write path, plugins publish and delete through format.Deps.Ingest (CLAUDE.md invariants)
    gocyclo:
      min-complexity: 15
    importas:
      alias:
        - pkg: github.com/opencontainers/image-spec/specs-go/v1
          alias: ocispec
  exclusions:
    rules:
      # The CLI prints to the terminal.
      - path: ^cmd/
        linters: [forbidigo]
      # Tests build requests with httptest.NewRequest and dial without a context.
      - path: _test\.go$
        linters: [noctx, forbidigo]
      # One write path binds the plugins only.
      - path-except: ^internal/format/
        linters: [forbidigo]
        text: one write path

formatters:
  enable:
    - gofmt
    - goimports
