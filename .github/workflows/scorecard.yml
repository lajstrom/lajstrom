name: Scorecard

# OpenSSF Scorecard (#380): the supply-chain checks of https://scorecard.dev on this repository,
# their results in code scanning, and the score published for the README's badge. It runs on
# main only: publishing needs the default branch.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # weekly, Monday 05:41 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the SARIF upload to code scanning
      id-token: write # publishing the results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A maintainer's fine-grained PAT with Administration read-only on this repository, so
          # that Branch-Protection is measured (#1013); without the secret, GITHUB_TOKEN, which
          # cannot read branch protection, and the check is skipped as before.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
