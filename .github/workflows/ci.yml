name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Dependency licenses allowed without a maintainer decision (see CONTRIBUTING.md).
  ALLOWED_LICENSES: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense,CC0-1.0,0BSD

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  changes:
    name: changes
    # Decides whether the integration job runs. A paths filter under on: would gate the whole
    # workflow, so the filter is a job: on a pull request, any changed path that matches below;
    # on a push to main, always.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Paths that need the integration tests
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "${GITHUB_EVENT_NAME}: the integration tests run"
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --name-only "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changed.txt"
          # Go code, the module files, the dev stack, the workflows, the Makefile, the
          # migrations and the test scripts. Matching paths are printed.
          if grep -E '\.go$|^go\.(mod|sum)$|^deploy/|^\.github/workflows/|^Makefile$|^internal/index/migrations/|^test/' "${RUNNER_TEMP}/changed.txt"; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "no path that needs the integration tests changed: they are skipped"
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  integration:
    # One cell per registry. The store suite runs on SQLite and on Postgres in both: the Postgres
    # tests run whenever LAJSTROM_TEST_POSTGRES_DSN is set. Branch protection requires
    # integration-result, not these cells (see there).
    name: integration (${{ matrix.registry }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        registry: [zot, distribution]
        include:
          - registry: zot
            address: localhost:5000
          - registry: distribution
            address: localhost:5001
    # The images of deploy/compose/compose.yaml (#15), with the digests of their indexes: change
    # a tag here and there together. Every cell runs all three; the matrix picks the registry
    # the tests talk to.
    services:
      zot:
        # Zot v2.1.23, the minimal build.
        # sha256:59cb5740832970818903c5ce104425762664c7880835ee566506aad397cd3458
        # The image's own configuration (HTTP on 5000, no auth): a service cannot mount
        # deploy/compose/zot/config.json from the checkout. No health check: --health-cmd always
        # runs through /bin/sh, the image has no shell, and the container would turn unhealthy.
        # The first step waits for /v2/ instead.
        image: ghcr.io/project-zot/zot-minimal:v2.1.23
        ports:
          - "5000:5000"
      distribution:
        # distribution 3.1.2.
        # sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
        image: registry:3.1.2
        env:
          REGISTRY_STORAGE_DELETE_ENABLED: "true"
          REGISTRY_LOG_LEVEL: info
        ports:
          - "5001:5000"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:5000/v2/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgres:
        # PostgreSQL 17.11 on Alpine.
        # sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: lajstrom
          POSTGRES_USER: lajstrom
          POSTGRES_PASSWORD: lajstrom
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lajstrom -d lajstrom"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      LAJSTROM_TEST_REGISTRY: ${{ matrix.address }}
      LAJSTROM_TEST_POSTGRES_DSN: "postgres://lajstrom:lajstrom@localhost:5432/lajstrom?sslmode=disable"
    steps:
      - name: Wait for the services
        # The steps start once distribution and Postgres pass their health checks; Zot has none.
        # One probe per service, so that a failure names it.
        timeout-minutes: 2
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          ready() { # name, then a command that succeeds once the service answers
            local name=$1
            shift
            for _ in $(seq 1 30); do
              if "$@" > /dev/null 2>&1; then
                echo "ready: ${name}"
                return 0
              fi
              sleep 1
            done
            echo "::error::${name} did not answer within 30 s: $*"
            return 1
          }
          ready zot curl -fsS --max-time 2 http://localhost:5000/v2/
          ready distribution curl -fsS --max-time 2 http://localhost:5001/v2/
          ready postgres docker exec "${POSTGRES_CONTAINER}" pg_isready -h 127.0.0.1 -U lajstrom -d lajstrom
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go caches the module and build caches, keyed by go.sum (cache: true is its
      # default); nothing else is cached.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Integration tests
        run: go test -race -tags integration ./...

  integration-result:
    name: integration-result
    # The required check for the integration tests: green when both cells passed, or when the
    # changes job found no path that needs them. A matrix job skipped by its if reports a single
    # check with the unexpanded name, not integration (zot) and integration (distribution), so
    # the cells cannot be required themselves: a doc-only pull request would wait for them.
    needs: [changes, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Result of the integration cells
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "changes: ${CHANGES}, code: ${CODE:-unset}, integration: ${INTEGRATION}"
          case "${CHANGES}/${CODE}/${INTEGRATION}" in
            success/true/success) echo "the integration tests passed on both registries" ;;
            success/false/skipped) echo "no path that needs the integration tests changed" ;;
            *)
              echo "::error::the integration tests did not pass (changes: ${CHANGES}, integration: ${INTEGRATION})"
              exit 1
              ;;
          esac

  e2e:
    # make e2e (#34, docs/testing.md): bin/lajstrom on the runner against Zot, and the scenarios
    # of test/e2e/ with real clients, curl on the runner and oras, apt-get, pip, mvn, gradle, npm,
    # pnpm and yarn in containers with --network host; then apt.sh again in the other apt clients
    # of #48, cosign.sh against distribution, a registry without the referrers API (#28), and
    # npm.sh against distribution (#312). npm.sh reaches registry.npmjs.org: it installs pnpm and
    # yarn from there, and its proxy repo fetches a public package through it. The same paths as
    # the integration cells decide whether it runs. Not a matrix, so a skipped run reports the
    # check e2e itself.
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      zot:
        # The Zot of the integration job: v2.1.23, the minimal build, on the configuration built
        # into its image, without a health check (see there).
        # sha256:59cb5740832970818903c5ce104425762664c7880835ee566506aad397cd3458
        image: ghcr.io/project-zot/zot-minimal:v2.1.23
        ports:
          - "5000:5000"
      distribution:
        # The distribution of the integration job, for cosign.sh below: no referrers API, so the
        # facade writes the sha256-<hex> tag schema under the referrers lock (#28).
        # sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
        image: registry:3.1.2
        env:
          REGISTRY_STORAGE_DELETE_ENABLED: "true"
          REGISTRY_LOG_LEVEL: info
        ports:
          - "5001:5000"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:5000/v2/"
          --health-interval 2s
          --health-timeout 5s
    steps:
      - name: Wait for Zot
        timeout-minutes: 1
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "ready: zot"
              exit 0
            fi
            sleep 1
          done
          echo "::error::zot did not answer within 30 s: curl http://localhost:5000/v2/"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Pull the client images
        # The images the scenarios run (test/e2e/*.sh headers), pulled once here, four at a
        # time, so that the budgets of the next steps are the scenarios'. oras is not installed:
        # oras.sh uses the image too. ubuntu:22.04 and debian:12 are for the apt step below.
        # The runner is linux/amd64, the platform apt.sh asks for.
        id: images
        timeout-minutes: 4
        run: |
          set -euo pipefail
          images=(
            ubuntu:24.04                    # apt.sh, tokens.sh
            ubuntu:22.04                    # apt.sh, below
            debian:12                       # apt.sh, below
            ghcr.io/oras-project/oras:v1.3.6
            python:3.13                     # pypi.sh
            maven:3.9.16-eclipse-temurin-21 # maven.sh
            gradle:8.14.6-jdk21             # maven.sh
            ghcr.io/sigstore/cosign/cosign:v3.1.4 # cosign.sh
            node:26.13.0-slim               # npm.sh
          )
          printf '%s\n' "${images[@]}" | xargs -n 1 -P 4 docker pull --quiet --platform linux/amd64
      - name: Cache of the maven and gradle clients
        # maven.sh's local repository and GRADLE_USER_HOME, the plugins and dependencies that mvn
        # and gradle download from Maven Central: host directories here (MAVEN_E2E_M2 and
        # MAVEN_E2E_GRADLE_HOME below, the script's header) instead of its docker volumes, so that
        # they outlive the runner. The key follows the script, which names the images, and the
        # fixtures; nothing of a run stays in the local repository, and gradle drops what a run
        # resolved after 30 days unused. Gradle's lock files are left out.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/maven-e2e/m2
            ${{ runner.temp }}/maven-e2e/gradle/caches
            !${{ runner.temp }}/maven-e2e/gradle/caches/**/*.lock
            !${{ runner.temp }}/maven-e2e/gradle/caches/**/gc.properties
          key: maven-e2e-${{ runner.os }}-${{ hashFiles('test/e2e/maven.sh', 'test/e2e/fixtures/maven/**') }}
          restore-keys: |
            maven-e2e-${{ runner.os }}-
      - name: make e2e
        # The budget of #34. A failed scenario prints its FAIL lines and the last 50 lines of
        # the server log.
        timeout-minutes: 6
        env:
          LAJSTROM_E2E_REGISTRY: localhost:5000
          MAVEN_E2E_M2: ${{ runner.temp }}/maven-e2e/m2
          MAVEN_E2E_GRADLE_HOME: ${{ runner.temp }}/maven-e2e/gradle
        run: make e2e
      - name: apt.sh in ubuntu:22.04 and debian:12
        # #48: make e2e ran apt.sh in ubuntu:24.04, its default; here the issue's other two apt
        # clients, each with a run.sh of its own (a server of its own; bin/lajstrom is built). It
        # runs even when make e2e failed, and both images run when the first fails. The budget of
        # #48 is three minutes.
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 3
        env:
          LAJSTROM_E2E_REGISTRY: localhost:5000
        run: |
          set -euo pipefail
          failed=""
          for image in ubuntu:22.04 debian:12; do
            echo "=== APT_E2E_IMAGE=${image}"
            APT_E2E_IMAGE="${image}" test/e2e/run.sh apt || failed="${failed} ${image}"
          done
          if [ -n "${failed}" ]; then
            echo "::error::apt.sh failed in${failed}"
            exit 1
          fi
      - name: cosign.sh against distribution
        # #28: make e2e ran cosign.sh against Zot, which has the referrers API; here against
        # distribution, which has not: the signatures go to the sha256-<hex> tag, and cosign verify
        # and oras discover still find them. A run.sh of its own; bin/lajstrom is built.
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 2
        env:
          LAJSTROM_E2E_REGISTRY: localhost:5001
        run: test/e2e/run.sh cosign
      - name: cosign.sh against distribution without a catalog
        # #37: Lajstrom's capabilities.catalog false, so reindex reads oci_repos instead of
        # /v2/_catalog, which distribution cannot turn off.
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 2
        env:
          LAJSTROM_E2E_REGISTRY: localhost:5001
          LAJSTROM_E2E_CAPABILITIES: "{catalog: false}"
        run: test/e2e/run.sh cosign
      - name: npm.sh against distribution
        # #312: make e2e ran npm.sh against Zot; here against distribution, the registry of the
        # other integration cell: the journal of dist-tags, npm unpublish's deletes and the
        # proxy's fetches on a registry without the referrers API. A run.sh of its own;
        # bin/lajstrom is built.
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 3
        env:
          LAJSTROM_E2E_REGISTRY: localhost:5001
        run: test/e2e/run.sh npm

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # The OpenAPI document of the management API, linted with vacuum at the version the Makefile
      # pins (#47); TestOpenAPIRoutes in build-test holds it to the routes.
      - name: api-lint
        run: make api-lint

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: stable
          go-package: ./...

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check dependency licenses
        # --ignore lists modules whose license was verified by hand because the classifier
        # cannot read the text (CONTRIBUTING.md, dependency license policy). Keep it in step
        # with LICENSE_IGNORES in the Makefile.
        run: go-licenses check ./... --allowed_licenses="${ALLOWED_LICENSES}" --ignore modernc.org/mathutil

  snippet-scan:
    name: snippet-scan
    runs-on: ubuntu-latest
    # The job takes under a minute, a scan of the whole tree too. The limit stops a job that
    # hangs, as one did for over 20 minutes in the pip install of the client; the install (at
    # most 4.5 minutes) and the scan (4) have bounds of their own below, inside it, so that a
    # slow PyPI or API ends in a step that says so.
    timeout-minutes: 10
    env:
      SCANOSS_VERSION: 1.54.3
      # Optional: a SCANOSS API key (repository secret) switches the scan from the shared,
      # rate-limited OSSKB endpoint to the keyed API. Forks never see the secret and fall back.
      SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.13"
      - name: Cache of pip
        # The wheels of the client and its dependencies, keyed by the exact Python and the
        # pinned client: on a hit pip still asks PyPI's index, but downloads nothing.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-scanoss-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ env.SCANOSS_VERSION }}
      - name: Install ScanOSS client
        # Three attempts, each at most 75 s (one takes about 20): pip's --timeout ends a connection
        # that stalls, timeout(1) an attempt that crawls. PyPI unreachable three times fails the
        # job: without the client there is no scan.
        timeout-minutes: 5
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if timeout 75 python -m pip install --disable-pip-version-check --retries 2 --timeout 15 \
              "scanoss==${SCANOSS_VERSION}"; then
              exit 0
            fi
            echo "::warning::snippet-scan: pip install scanoss==${SCANOSS_VERSION}, attempt ${attempt} of 3, failed"
            [ "${attempt}" = 3 ] || sleep $((attempt * 10))
          done
          echo "::error::snippet-scan: pip install scanoss==${SCANOSS_VERSION} failed three times"
          exit 1
      - name: Select files to scan
        # Pull requests: only files added or changed in the PR. Pushes to main: the whole tree.
        # Only source code is scanned: the snippet scan exists to catch copied code, and the
        # free OSSKB endpoint is rate-limited, so docs, YAML, JSON, images and lock files are
        # not sent at all. The selection is copied into a scratch directory so the scanner
        # sees nothing else.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/scan-input"
          mkdir -p "${target}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changed.txt"
          else
            git ls-files > "${RUNNER_TEMP}/changed.txt"
          fi
          count=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.go|*.py|*.sh|*.sql|*.js|*.ts|*.java|*.rs|*.c|*.h|*.cpp|*.proto|Makefile|*/Makefile|Dockerfile|*/Dockerfile) ;;
              *) continue ;;
            esac
            mkdir -p "${target}/$(dirname "$f")"
            cp "$f" "${target}/$f"
            count=$((count + 1))
          done < "${RUNNER_TEMP}/changed.txt"
          echo "files selected: ${count}"
          echo "SCAN_FILE_COUNT=${count}" >> "${GITHUB_ENV}"
      - name: Scan against the SCANOSS knowledge base
        # Only file fingerprints are sent, never source code. The free OSSKB endpoint is shared
        # by every GitHub runner and gets rate-limited; when the service is unavailable the
        # scan is reported as skipped instead of failing the build. A real match still fails.
        # A scan that runs past 4 minutes counts as an unavailable service too (timeout(1) exits
        # 124), so that the job's limit is not what ends it.
        run: |
          # The default shell runs with -e; the scanner pipeline below is allowed to fail so
          # that the API-availability check after it can decide. Keep -u and pipefail.
          set +e -uo pipefail
          if [ "${SCAN_FILE_COUNT:-0}" = "0" ]; then
            echo "SCAN_STATE=skipped-no-files" >> "${GITHUB_ENV}"
            echo "::notice::snippet-scan: no files to scan"
            exit 0
          fi
          args=(--retry 1 --output "${RUNNER_TEMP}/scanoss-results.json")
          if [ -n "${SCANOSS_API_KEY}" ]; then
            args+=(--apiurl https://api.scanoss.com/scan/direct --key "${SCANOSS_API_KEY}")
          fi
          timeout 240 scanoss-py scan "${args[@]}" "${RUNNER_TEMP}/scan-input" 2>&1 | tee "${RUNNER_TEMP}/scanoss.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            [ -s "${RUNNER_TEMP}/scanoss-results.json" ] || echo '{}' > "${RUNNER_TEMP}/scanoss-results.json"
            echo "SCAN_STATE=scanned" >> "${GITHUB_ENV}"
            exit 0
          fi
          if [ "$rc" -eq 124 ] || grep -qiE "rate limit|503|unavailable|ConnectionError|timed out" "${RUNNER_TEMP}/scanoss.log"; then
            echo "SCAN_STATE=skipped-api-unavailable" >> "${GITHUB_ENV}"
            echo "::warning::snippet-scan: SCANOSS API unavailable (rate limit, outage, or no result within 240 s, exit ${rc}); scan skipped for this run"
            exit 0
          fi
          echo "::error::snippet-scan: scanner failed for a reason other than API availability"
          exit "$rc"
      - name: Fail on undeclared third-party matches
        if: env.SCAN_STATE == 'scanned'
        # Exit code 2 means at least one file or snippet matched third-party code that is not
        # declared in scanoss.json. Explain the match in the pull request; see CONTRIBUTING.md.
        run: |
          scanoss-py inspect undeclared \
            --input "${RUNNER_TEMP}/scanoss-results.json" \
            --format md \
            --output "${RUNNER_TEMP}/scanoss-undeclared.md" \
            --status "${RUNNER_TEMP}/scanoss-status.md"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Snippet scan (ScanOSS ${SCANOSS_VERSION})"
            echo
            echo "State: \`${SCAN_STATE:-unknown}\`, files selected: ${SCAN_FILE_COUNT:-0}"
            echo
            cat "${RUNNER_TEMP}/scanoss-status.md" 2>/dev/null || true
            cat "${RUNNER_TEMP}/scanoss-undeclared.md" 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One line per commit: sha, parent count, signed-off (true/false), subject.
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | [.sha[0:12], (.parents | length), (.commit.message | split("\n") | any(test("^Signed-off-by: .+ <.+>\\s*$"))), (.commit.message | split("\n")[0])] | @tsv' \
            > commits.tsv
          missing=0
          while IFS=$'\t' read -r sha parents signed subject; do
            if [ "${parents}" -gt 1 ]; then
              echo "skip  ${sha} (merge commit) ${subject}"
            elif [ "${signed}" = "true" ]; then
              echo "ok    ${sha} ${subject}"
            else
              echo "::error::Commit ${sha} has no Signed-off-by line: ${subject}"
              missing=$((missing + 1))
            fi
          done < commits.tsv
          if [ "${missing}" -gt 0 ]; then
            echo "${missing} commit(s) are not signed off. Use 'git commit -s'; to fix existing commits run 'git rebase --signoff main' and push again. See CONTRIBUTING.md."
            exit 1
          fi
