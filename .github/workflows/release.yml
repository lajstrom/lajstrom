# Release (#57). A pushed tag v* runs goreleaser (.goreleaser.yaml): the binaries for linux and
# darwin on amd64 and arm64, their archives, checksums.txt and the SBOMs on a draft GitHub
# release; the multi-arch image on ghcr.io and Docker Hub; cosign signatures of checksums.txt
# and of the images, keyless through the job's GitHub OIDC token; the Homebrew cask in
# lajstrom/homebrew-tap. The chart job then pushes the Helm chart to
# oci://ghcr.io/lajstrom/charts/lajstrom, its version the tag's (#82), and signs it the same way.
# A maintainer publishes the draft. docs/release.md has the steps.
#
# The snapshot job runs the same configuration without publishing or signing on every push to
# main and on a pull request that changes it, packages the chart at the snapshot's version, and
# keeps the archives, checksums, SBOMs and chart as a workflow artifact for testing.
#
# The preflight job checks the secrets below before the release job publishes anything; run by
# hand (Run workflow), it checks them before a tag is pushed.
#
# Repository secrets of the release job; GITHUB_TOKEN covers the release and ghcr.io:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  a Docker Hub user and an access token with read and
#                                        write on docker.io/lajstrom/lajstrom; without them
#                                        the images go to ghcr.io only, with a warning
#   HOMEBREW_TAP_TOKEN                   a fine-grained token with contents: write on
#                                        lajstrom/homebrew-tap; without it the cask is not
#                                        pushed, with a warning
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - Dockerfile
      - .github/workflows/release.yml
  workflow_dispatch: # the preflight job only

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A release is never cancelled half-way; a newer push to main replaces its snapshot.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # The goreleaser of GORELEASER_IMAGE in the Makefile, and the syft and cosign its image has.
  GORELEASER_VERSION: v2.20.0
  SYFT_VERSION: v1.55.0
  COSIGN_VERSION: v3.1.4
  GOVULNCHECK_VERSION: v1.9.0
  # The helm of ci.yml's job helm, checked against get.helm.sh/<tarball>.sha256sum.
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b

jobs:
  snapshot:
    name: snapshot
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags and history: git describe, the snapshot version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # No Go cache in either job, so that no cache another run wrote reaches a build that
          # is published or uploaded (cache poisoning).
          cache: false
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: goreleaser release --snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish,sign
      - name: Run the binary and the image
        # The image of the runner's platform; the arm64 one would need emulation.
        run: |
          set -euo pipefail
          version="$(jq -r .version dist/metadata.json)"
          tar -xzf "dist/lajstrom_${version}_linux_amd64.tar.gz" -C "${RUNNER_TEMP}" lajstrom
          "${RUNNER_TEMP}/lajstrom" version
          docker run --rm "ghcr.io/lajstrom/lajstrom:v${version}-amd64" version
          docker image inspect "ghcr.io/lajstrom/lajstrom:v${version}-amd64" --format '{{json .Config.Labels}}'
      - name: Install helm
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/helm"
          mkdir -p "${tmp}"
          curl -fsSL --retry 3 -o "${tmp}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${tmp}/helm.tgz" | sha256sum -c -
          tar -xzf "${tmp}/helm.tgz" -C "${tmp}" --strip-components=1 linux-amd64/helm
          echo "${tmp}" >> "${GITHUB_PATH}"
      - name: Package the chart
        # As the chart job publishes it, at the snapshot's version: it runs the image of that version.
        run: |
          set -euo pipefail
          version="$(jq -r .version dist/metadata.json)"
          make helm-package CHART_VERSION="${version}"
          helm show chart "dist/chart/lajstrom-${version}.tgz" | grep -E '^(version|appVersion):'
          helm template lajstrom "dist/chart/lajstrom-${version}.tgz" | grep -F "image: ghcr.io/lajstrom/lajstrom:v${version}"
      - name: The Go of the binary
        # goreleaser builds with the Go of setup-go. govulncheck reads the binary and fails on a
        # vulnerable function of the standard library that it links; findings in modules are only
        # in its output: ci.yml's vulncheck judges them from the source, and binary mode matches
        # some by module alone (GO-2026-5932, x/crypto/openpgp, which the binary does not link).
        run: |
          set -euo pipefail
          bin=dist/lajstrom_linux_amd64_v1/lajstrom
          go version "${bin}"
          [ "$(go version "${bin}" | cut -d' ' -f2)" = "$(go env GOVERSION)" ]
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -mode=binary -format json "${bin}" \
            > "${RUNNER_TEMP}/govulncheck.json"
          stdlib="$(jq -r 'select(.finding) | .finding
              | select(.trace[0].module == "stdlib" and .trace[0].function != null) | .osv' \
            "${RUNNER_TEMP}/govulncheck.json" | sort -u | paste -sd ' ' -)"
          if [ -n "${stdlib}" ]; then
            echo "::error::$(go version "${bin}"), with known vulnerabilities in its standard library: ${stdlib}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lajstrom-snapshot
          path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt
            dist/homebrew/Casks/lajstrom.rb
            dist/metadata.json
            dist/chart/*.tgz
          if-no-files-found: error
          retention-days: 14

  # Before the release job, so that a missing or wrong secret stops the release before anything is
  # published. A secret that is set must work; one that is not set is a warning.
  preflight:
    name: preflight
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the Docker Hub and Homebrew tap secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          failed=0
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::warning::DOCKERHUB_USERNAME is not set: the images are pushed to ghcr.io only, not to docker.io/lajstrom/lajstrom"
          else
            # The actions that Docker Hub's registry token grants on lajstrom/lajstrom; push also
            # creates the repository at the first release if it does not exist.
            actions="$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
                'https://auth.docker.io/token?service=registry.docker.io&scope=repository:lajstrom/lajstrom:pull,push' |
              jq -r '.token | split(".")[1] | gsub("-"; "+") | gsub("_"; "/") | . + ("=" * ((4 - length % 4) % 4))
                | @base64d | fromjson | [.access[]? | select(.name == "lajstrom/lajstrom") | .actions[]] | join(",")')" ||
              actions="login failed"
            echo "Docker Hub grants ${DOCKERHUB_USERNAME} on lajstrom/lajstrom: ${actions:-nothing}"
            case ",${actions}," in
              *,push,*) ;;
              *) echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN cannot push docker.io/lajstrom/lajstrom: a user of the lajstrom namespace and an access token with Read & Write"
                failed=1 ;;
            esac
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the cask is not pushed to lajstrom/homebrew-tap"
          else
            # A blob that no commit names: the write goreleaser needs, without a change to the tap.
            if curl -fsS -o /dev/null -X POST \
                -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" -H "Accept: application/vnd.github+json" \
                -d '{"content":"lajstrom release preflight\n","encoding":"utf-8"}' \
                https://api.github.com/repos/lajstrom/homebrew-tap/git/blobs; then
              echo "HOMEBREW_TAP_TOKEN can write to lajstrom/homebrew-tap"
            else
              echo "::error::HOMEBREW_TAP_TOKEN cannot write to lajstrom/homebrew-tap: a fine-grained token with Contents read and write on that repository"
              failed=1
            fi
          fi
          exit "${failed}"

  release:
    name: release
    needs: preflight
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the draft release and its assets
      packages: write # ghcr.io/lajstrom/lajstrom
      id-token: write # cosign keyless: the OIDC token Fulcio certifies
    env:
      # Read by the conditions below and by .goreleaser.yaml (the docker.io image name).
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags and history: the previous tag, the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: The Go of the release
        # It builds the binaries: the latest patch release of its minor version (setup-go's stable
        # can lag a Go security release), and govulncheck finds nothing that the code reaches.
        run: |
          set -euo pipefail
          have="$(go env GOVERSION)"
          minor="$(echo "${have}" | cut -d. -f1-2)"
          latest="$(curl -fsS 'https://go.dev/dl/?mode=json' | jq -r --arg minor "${minor}" \
            '[.[] | select(.stable) | .version | select(. == $minor or startswith($minor + "."))] | first // empty')"
          echo "Go ${have}; the latest release of ${minor}: ${latest:-not listed}"
          if [ "${have}" != "${latest}" ]; then
            echo "::error::Go ${have} is not the latest patch release${latest:+ (${latest})}: rerun when setup-go has it"
            exit 1
          fi
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      # The docker-container driver: one multi-arch push with the SBOM attestation. The
      # Dockerfile only copies files, so no emulation is needed for arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: The previous stable tag
        id: previous
        # The notes of v0.1.0 list the changes since v0.0.1, not since v0.1.0-rc.2, the tag that
        # goreleaser would take. A pre-release keeps goreleaser's choice, the nearest tag.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          echo "The notes list the changes since ${tag:-the first commit}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The tag this run is for, not another one on the same commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Empty on a pre-release: goreleaser finds the previous tag itself.
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}

  # The Helm chart (#82), in lockstep with the release: version the tag without its v, appVersion
  # the tag, so that it runs the image the release job has just pushed. A pre-release's chart
  # (0.1.0-rc.1) is installed only by its --version. A rerun pushes it again under the same
  # version, with a new digest that it signs.
  chart:
    name: chart
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # ghcr.io/lajstrom/charts/lajstrom
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install helm
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/helm"
          mkdir -p "${tmp}"
          curl -fsSL --retry 3 -o "${tmp}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${tmp}/helm.tgz" | sha256sum -c -
          tar -xzf "${tmp}/helm.tgz" -C "${tmp}" --strip-components=1 linux-amd64/helm
          echo "${tmp}" >> "${GITHUB_PATH}"
      # For cosign; helm keeps its own login.
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and sign the chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart=ghcr.io/lajstrom/charts/lajstrom
          make helm-package CHART_VERSION="${version}"
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/chart/lajstrom-${version}.tgz" oci://ghcr.io/lajstrom/charts | tee "${RUNNER_TEMP}/push.log"
          digest="$(sed -n 's/^Digest: //p' "${RUNNER_TEMP}/push.log")"
          [ -n "${digest}" ] || { echo "::error::helm push printed no digest"; exit 1; }
          cosign sign --yes "${chart}@${digest}"
          cosign verify "${chart}@${digest}" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          helm show chart "oci://${chart}" --version "${version}" | grep -E '^(version|appVersion):'
          echo "Pushed and signed \`oci://${chart}\` ${version}, ${digest}" >> "${GITHUB_STEP_SUMMARY}"
