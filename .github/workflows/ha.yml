name: HA

# test/e2e/ha.sh (#226, docs/testing.md) on a runner of its own (#562): the ha profile of the
# dev stack, two replicas of Lajstrom built from the checkout, round robin behind nginx, on a
# Postgres and a distribution of their own (make dev-up PROFILES=ha), and the steps of
# acceptance.md §4 but H-01 (HA_SUITE=none): the scenarios the e2e job of ci.yml runs against
# one server are not run again through the edge. About 6 to 8 minutes. A workflow of its own,
# outside CI, so that it blocks no merge: every night, by hand, and on a pull request that
# changes what the replicas share (ingest, the index, the facade), the profile (its services in
# compose.yaml, deploy/compose/ha, the nginx configuration its edge serves), the scripts the job
# runs, or this file. Not a required check.
on:
  pull_request:
    paths:
      - "internal/ingest/**"
      - "internal/index/**"
      - "internal/facade/**"
      - "deploy/compose/compose.yaml"
      - "deploy/compose/ha/**"
      - "deploy/nginx/**"
      - "test/e2e/ha.sh"
      - "test/e2e/lib.sh"
      - "test/e2e/run.sh"
      - ".github/workflows/ha.yml"
  schedule:
    - cron: "11 3 * * *" # nightly, 03:11 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ha:
    name: ha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Pull the client images
        # The images ha.sh runs without H-01 (its header), pulled once here so that the budget of
        # its step is the script's: oras, which is not installed, cosign for the step of #28,
        # and the apt client of H-11. python3 of the runner builds the wheel of H-13. The runner
        # is linux/amd64, the platform H-11 asks for.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          images=(
            ghcr.io/oras-project/oras:v1.3.6
            ghcr.io/sigstore/cosign/cosign:v3.1.4
            ubuntu:24.04 # H-11
          )
          printf '%s\n' "${images[@]}" | xargs -n 1 -P 4 docker pull --quiet --platform linux/amd64
      - name: The dev stack with the ha profile
        # Zot, distribution and Postgres, Zot for the server make e2e serves; and the ha profile,
        # its replicas built from the checkout; all healthy.
        timeout-minutes: 10
        run: make dev-up PROFILES=ha
      - name: ha.sh
        # make e2e with ha.sh only, as a developer runs it (docs/testing.md); HA_SUITE=none
        # leaves out H-01. A failed step prints its FAIL lines.
        timeout-minutes: 15
        env:
          HA_SUITE: none
        run: make e2e E2E=ha
      - name: The logs of the ha profile
        # The last lines of each service of the profile in the log, and the whole logs as an
        # artifact below.
        if: ${{ failure() }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ha-logs"
          for s in lajstrom-a lajstrom-b ha-nginx ha-distribution ha-postgres; do
            docker compose -f deploy/compose/compose.yaml --profile ha logs --no-color "${s}" > "${RUNNER_TEMP}/ha-logs/${s}.log" 2>&1
            echo "::group::${s}"
            tail -n 100 "${RUNNER_TEMP}/ha-logs/${s}.log"
            echo "::endgroup::"
          done
          docker compose -f deploy/compose/compose.yaml --profile ha ps -a
      - name: Keep the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-logs
          path: ${{ runner.temp }}/ha-logs/
          if-no-files-found: ignore
