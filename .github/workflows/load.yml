name: Load

# The load test of #62 on Linux (#281): make load (test/load/run.sh, docs/operations.md,
# Performance) against the Zot of the dev stack, 1 GiB through raw and /v2 with 8 uploads and 8
# downloads at once; it fails when the server's resident set passes 256 MiB. Every night and by
# hand, and on a pull request that changes the test or this workflow, so that a change of either
# is measured before it is merged. It moves 32 GiB and needs 18 GiB of free disk, too much for
# every pull request. Not a required check.
on:
  schedule:
    - cron: "37 3 * * *" # nightly, 03:37 UTC
  workflow_dispatch:
    inputs:
      size_mib:
        description: The size of the object in MiB (LAJSTROM_LOAD_SIZE_MIB)
        default: "1024"
      uploads:
        description: Uploads at once (LAJSTROM_LOAD_UPLOADS)
        default: "8"
      downloads:
        description: Downloads at once (LAJSTROM_LOAD_PARALLEL)
        default: "8"
  pull_request:
    paths:
      - .github/workflows/load.yml
      - test/load/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: load
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The inputs of a run by hand; the schedule and pull requests have none and take the
      # defaults. Passed to the steps as variables, never spliced into a script.
      LAJSTROM_LOAD_SIZE_MIB: ${{ inputs.size_mib || '1024' }}
      LAJSTROM_LOAD_UPLOADS: ${{ inputs.uploads || '8' }}
      LAJSTROM_LOAD_PARALLEL: ${{ inputs.downloads || '8' }}
      LAJSTROM_LOAD_REGISTRY: localhost:5000
      ORAS_VERSION: 1.3.6
      # sha256 of oras_1.3.6_linux_amd64.tar.gz, from oras_1.3.6_checksums.txt of the release.
      ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free the disk
        # The script wants (1 + 2 x uploads) x size + 1 GiB free at the peak (its header), 18 GiB
        # at the defaults; 4 GiB more for the Go caches, the build and the images. When the root
        # filesystem has less, the preinstalled SDKs this job does not use go, all at once.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for v in "${LAJSTROM_LOAD_SIZE_MIB}" "${LAJSTROM_LOAD_UPLOADS}" "${LAJSTROM_LOAD_PARALLEL}"; do
            [[ "${v}" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::the inputs are positive integers, not '${v}'"; exit 1; }
          done
          # TMPDIR of the next steps: the object, the spools and the build in a directory of the
          # job on the root filesystem, where Docker keeps Zot's volume too, so that the
          # script's disk check covers both.
          TMPDIR="${RUNNER_TEMP}/load"
          mkdir -p "${TMPDIR}"
          echo "TMPDIR=${TMPDIR}" >> "${GITHUB_ENV}"
          need_mib=$(( (1 + 2 * LAJSTROM_LOAD_UPLOADS) * LAJSTROM_LOAD_SIZE_MIB + 1024 + 4096 ))
          free_mib() { df -Pk "${TMPDIR}" | awk 'NR == 2 {printf "%d", $4 / 1024}'; }
          df -h / /mnt 2> /dev/null || df -h /
          echo "free in ${TMPDIR}: $(free_mib) MiB; needed: ${need_mib} MiB"
          if [ "$(free_mib)" -ge "${need_mib}" ]; then
            exit 0
          fi
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy /usr/local/share/boost \
            /usr/share/swift /usr/local/julia* /opt/microsoft /usr/local/share/powershell; do
            if [ -e "${d}" ]; then
              sudo rm -rf "${d}" &
            fi
          done
          wait
          df -h /
          echo "free in ${TMPDIR}: $(free_mib) MiB; needed: ${need_mib} MiB"
          if [ "$(free_mib)" -lt "${need_mib}" ]; then
            echo "::error::not enough free disk for the load test: $(free_mib) MiB, ${need_mib} MiB needed"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install oras
        # The release binary for linux/amd64, checked against the sha256 above; the version of
        # the oras image of the e2e job.
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "::error::oras is pinned for linux/amd64, the runner is $(uname -m)"; exit 1; }
          archive="${RUNNER_TEMP}/oras.tar.gz"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" oras
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/oras" version
          command -v lsof > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
      - name: The dev stack
        # Zot (the registry of the test), distribution and Postgres of deploy/compose, healthy.
        timeout-minutes: 5
        run: make dev-up
      - name: The runner
        # What the numbers were measured on, in the log and at the top of the job summary.
        run: |
          {
            echo "### Runner"
            echo
            echo '```text'
            echo "$(. /etc/os-release && echo "${PRETTY_NAME}"), kernel $(uname -r), $(uname -m)"
            echo "$(nproc) CPUs: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
            free -m | awk '$1 == "Mem:" {print "memory: " $2 " MiB"}'
            echo "Docker $(docker version --format '{{.Server.Version}}'), $(docker compose version --short 2>/dev/null | sed 's/^/compose /')"
            echo "Zot: $(docker compose -f deploy/compose/compose.yaml ps zot --format '{{.Image}}')"
            df -h "${TMPDIR}" | awk 'NR == 2 {print "disk of TMPDIR: " $4 " free of " $2 " on " $6}'
            echo '```'
            echo
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: make load
        timeout-minutes: 25
        env:
          LAJSTROM_LOAD_SUMMARY: ${{ runner.temp }}/load-summary.md
          LAJSTROM_LOAD_KEEP: "1"
        run: make load
      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ runner.temp }}/load-summary.md
        run: |
          if [ -s "${SUMMARY}" ]; then
            cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "**Failed** before the table: see the log of make load." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: The logs of a failed run
        # The server's log and the clients' errors from the directory the script kept
        # (LAJSTROM_LOAD_KEEP), the last samples, and Zot's log. Not uploaded: the directory
        # holds the run's admin password.
        if: ${{ failure() }}
        run: |
          for d in "${TMPDIR}"/lajstrom-load.*; do
            for f in server.log client.log samples; do
              [ -f "${d}/${f}" ] || continue
              echo "::group::${d}/${f}"
              tail -n 100 "${d}/${f}"
              echo "::endgroup::"
            done
          done
          echo "::group::zot"
          docker compose -f deploy/compose/compose.yaml logs --tail 100 zot
          echo "::endgroup::"
          df -h /
